<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather</title>
<style>
:root {
  --bg: #f6f7f9;
  --bg-panel: #ffffff;
  --fg: #1c1f26;
  --fg-muted: #5c6370;
  --border: #d9dde3;
  --accent: #2b7de9;
  --ok: #2fa84f;
  --busy: #e6a700;
  --error: #d64545;
  --zoom: 1;
  --radius: 10px;
  --gap: calc(clamp(8px, 1vw, 16px) * var(--zoom));
  --fs-base: calc(clamp(14px, 1.2vw, 20px) * var(--zoom));
  --fs-small: calc(var(--fs-base) * 0.8);
  --fs-large: calc(var(--fs-base) * 1.6);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
html[data-theme="dark"] {
  --bg: #12151b;
  --bg-panel: #1b1f27;
  --fg: #e7eaf0;
  --fg-muted: #9aa3b2;
  --border: #2d333f;
  --accent: #5b9cf5;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--fs-base);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#toolbar {
  display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--gap) / 2);
  padding: calc(var(--gap) / 2) var(--gap);
  transition: opacity 0.6s;
}
#toolbar.idle { opacity: 0.15; }
.icon-btn {
  width: 2.2em; height: 2.2em; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-panel); color: var(--fg);
  cursor: pointer; display: grid; place-items: center; padding: 0; font: inherit;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 1.3em; height: 1.3em; fill: currentColor; }
.icon-btn.attention { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
#content { flex: 1; min-height: 0; padding: 0 var(--gap) var(--gap); }
#status-bar {
  display: flex; justify-content: center; align-items: center; gap: var(--gap);
  padding: calc(var(--gap) / 2) var(--gap);
  border-top: 1px solid var(--border);
  font-size: var(--fs-small); color: var(--fg-muted);
}
#status-dot {
  width: 0.7em; height: 0.7em; border-radius: 50%;
  background: var(--fg-muted);
}
#status-dot[data-state="ok"] { background: var(--ok); }
#status-dot[data-state="busy"] { background: var(--busy); }
#status-dot[data-state="error"] { background: var(--error); }
#status-message[data-state="error"] { color: var(--error); }
dialog#settings {
  background: var(--bg-panel); color: var(--fg);
  border: 1px solid var(--border); border-radius: var(--radius);
  width: min(90vw, 36em); height: min(85vh, 32em); padding: 0;
  display: none; grid-template-rows: auto auto 1fr; overflow: hidden;
}
dialog#settings[open] { display: grid; }
dialog#settings::backdrop { background: rgba(0,0,0,0.5); }
.dlg-header { display: flex; align-items: center; padding: calc(var(--gap) / 2) var(--gap); border-bottom: 1px solid var(--border); }
.dlg-header h2 { margin: 0; font-size: var(--fs-base); flex: 1; }
.tabs { display: flex; gap: 2px; padding: 0 var(--gap); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button {
  background: none; border: none; color: var(--fg-muted); padding: 0.6em 1em;
  cursor: pointer; border-bottom: 2px solid transparent; font: inherit; white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab-body { overflow: auto; min-height: 0; }
.tab-panel { display: none; padding: var(--gap); }
.tab-panel.active { display: block; }
.field { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); align-items: center; margin-bottom: var(--gap); }
.field label { color: var(--fg-muted); }
select, input, textarea, button.btn {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.4em 0.6em;
}
textarea#data-text { width: 100%; min-height: 10em; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: var(--fs-small); resize: vertical; }
button.btn { cursor: pointer; }
button.btn.danger { color: var(--error); }
.row { display: flex; gap: var(--gap); flex-wrap: wrap; }
.hint { color: var(--fg-muted); font-size: var(--fs-small); margin: calc(var(--gap) / 2) 0; }
#data-message { min-height: 1.4em; margin-top: calc(var(--gap) / 2); }
#data-message[data-state="error"] { color: var(--error); }
.about h3 { margin: var(--gap) 0 calc(var(--gap) / 3); font-size: var(--fs-base); }
.about ul { margin: 0; padding-left: 1.2em; }
.about a { color: var(--accent); }
:root {
  --sun: #f5a623;
  --cloud: #8b96a8;
  --rain: #3b8ee6;
  --snow: #7fc4ff;
  --bolt: #e8b400;
  --fs-temp: calc(clamp(48px, 7vw, 120px) * var(--zoom));
}
html[data-theme="dark"] { --cloud: #a7b0bf; }
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --bg: #12151b; --bg-panel: #1b1f27; --fg: #e7eaf0; --fg-muted: #9aa3b2; --border: #2d333f; --accent: #5b9cf5; --cloud: #a7b0bf;
  }
}
#content {
  display: grid;
  grid-template-columns: 28fr 72fr;
  grid-template-rows: auto 55fr 45fr;
  gap: var(--gap);
}
#page-title { grid-column: 1 / 3; margin: 0; text-align: center; font-size: var(--fs-large); font-weight: 600; line-height: 1.2; min-height: 1.2em; }
.panel {
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: var(--gap); min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column;
}
.panel h2 { margin: 0 0 calc(var(--gap) / 2); font-size: var(--fs-small); color: var(--fg-muted); font-weight: 600; }
#panel-current { grid-row: 2 / 4; align-items: center; text-align: center; justify-content: center; }
#cur-icon { width: calc(clamp(80px, 12vw, 220px) * var(--zoom)); height: calc(clamp(80px, 12vw, 220px) * var(--zoom)); }
#cur-temp { font-size: var(--fs-temp); font-weight: 300; line-height: 1; }
#cur-temp small { font-size: 0.4em; vertical-align: top; }
#cur-text { font-size: var(--fs-large); margin: calc(var(--gap) / 2) 0; }
#cur-humidity { font-size: calc(var(--fs-large) * 1.1); font-weight: 600; }
.cur-meta { color: var(--fg-muted); font-size: var(--fs-base); display: grid; gap: 0.2em; margin-top: var(--gap); }
.cur-meta span.label { color: var(--fg-muted); margin-right: 0.5em; }
.cols { display: grid; grid-template-columns: repeat(var(--cols, 16), 1fr); text-align: center; }
.cols > div { min-width: 0; overflow: hidden; white-space: nowrap; }
.cols .time { color: var(--fg-muted); font-size: var(--fs-small); }
.cols .time.day-start { color: var(--fg); font-weight: 600; }
.cols .temp { font-weight: 600; }
.cols .pop { color: var(--rain); font-size: var(--fs-small); }
.cols .pop small { color: var(--fg-muted); }
.cols .precip { color: var(--fg-muted); font-size: var(--fs-small); }
.icon { width: 1.8em; height: 1.8em; display: inline-block; vertical-align: middle; }
.legend { display: flex; align-items: center; gap: var(--gap); font-size: var(--fs-small); color: var(--fg-muted); margin: calc(var(--gap) / 2) 0 2px; }
.legend .chart-title { color: var(--fg); font-weight: 600; margin-right: auto; }
.legend .sw { display: inline-block; width: 1.4em; height: 0.7em; vertical-align: middle; margin-right: 0.35em; border-radius: 2px; }
.legend .sw.temp { height: 0; border-top: 2px solid var(--accent); border-radius: 0; }
.legend .sw.pop { background: var(--rain); opacity: 0.35; }
.legend .sw.precip { background: var(--rain); }
#hourly-chart { flex: 1; width: 100%; min-height: 0; }
#hourly-chart .temp-line { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
#hourly-chart .pop-bar { fill: var(--rain); opacity: 0.35; }
#hourly-chart .precip-bar { fill: var(--rain); }
#hourly-chart .grid { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
#weekly-grid { flex: 1; align-content: space-around; }
#weekly-grid .date { color: var(--fg-muted); font-size: var(--fs-small); }
#weekly-grid .date.weekend { color: var(--error); }
#weekly-grid .icon { width: 2.6em; height: 2.6em; }
#weekly-grid .temps b { color: var(--error); }
#weekly-grid .temps i { color: var(--accent); font-style: normal; }
.fallback { opacity: 0.55; }
#no-location { grid-column: 1 / 3; grid-row: 2 / 4; display: grid; place-items: center; font-size: var(--fs-large); color: var(--fg-muted); }
#no-location[hidden], .panel[hidden] { display: none; }
#jma-report { font-size: var(--fs-small); color: var(--fg-muted); }
#loc-results { width: 100%; min-height: 6em; }
.muted { color: var(--fg-muted); }
#panel-current { justify-content: safe center; }
</style>
</head>

<header id="toolbar">
  <button id="btn-theme" class="icon-btn" type="button" data-i18n-label="toggle_theme"><svg aria-hidden="true"><use href="#icon-dark-mode"></use></svg></button>
  <button id="btn-zoom-in" class="icon-btn" type="button" data-i18n-label="zoom_in"><svg aria-hidden="true"><use href="#icon-zoom-in"></use></svg></button>
  <button id="btn-zoom-out" class="icon-btn" type="button" data-i18n-label="zoom_out"><svg aria-hidden="true"><use href="#icon-zoom-out"></use></svg></button>
  <button id="btn-fullscreen" class="icon-btn" type="button" data-i18n-label="fullscreen"><svg aria-hidden="true"><use href="#icon-fullscreen"></use></svg></button>
  <button id="btn-lang" class="icon-btn" type="button" data-i18n-label="toggle_lang"><svg aria-hidden="true"><use href="#icon-translate"></use></svg></button>
  <button id="btn-settings" class="icon-btn" type="button" data-i18n-label="settings"><svg aria-hidden="true"><use href="#icon-settings"></use></svg></button>
</header>
<main id="content">
  <h1 id="page-title"></h1>
  <div id="no-location" hidden><span data-i18n="set_location_hint"></span></div>
  <section class="panel" id="panel-current">
    <h2 data-i18n="current"></h2>
    <svg id="cur-icon" class="icon"><use href="#icon-unknown"></use></svg>
    <div id="cur-temp">--<small>°C</small></div>
    <div id="cur-text"></div>
    <div id="cur-humidity"></div>
    <div class="cur-meta">
      <div><span class="label" data-i18n="apparent"></span><span id="cur-apparent"></span></div>
      <div><span class="label" data-i18n="wind"></span><span id="cur-wind"></span></div>
      <div><span class="label" data-i18n="wave"></span><span id="cur-wave"></span></div>
    </div>
  </section>
  <section class="panel" id="panel-hourly">
    <h2 data-i18n="hourly"></h2>
    <div id="hourly-grid"></div>
    <div id="hourly-legend" class="legend"></div>
    <svg id="hourly-chart" viewBox="0 0 1600 100" preserveAspectRatio="none"></svg>
  </section>
  <section class="panel" id="panel-weekly">
    <h2><span data-i18n="weekly"></span> <span id="jma-report"></span></h2>
    <div id="weekly-grid" class="cols"></div>
  </section>
</main>
<footer id="status-bar">
  <span id="clock"></span>
  <span id="status-message"></span>
  <span id="status-dot" data-state="none"></span>
</footer>
<dialog id="settings">
  <div class="dlg-header">
    <h2 data-i18n="settings"></h2>
    <button id="settings-close" class="icon-btn" type="button" data-i18n-label="close"><svg aria-hidden="true"><use href="#icon-close"></use></svg></button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="location" data-i18n="tab_location"></button>
    <button role="tab" data-tab="general" aria-selected="true" data-i18n="tab_general"></button>

  function coerce(spec, value) {
    if (value === undefined || value === null) return undefined;
    switch (spec.type) {
      case 'int': {
        const n = typeof value === 'number' ? value : Number.parseInt(String(value), 10);
        if (!Number.isInteger(n)) return undefined;
        if (spec.min !== undefined && n < spec.min) return undefined;
        if (spec.max !== undefined && n > spec.max) return undefined;
        return n;
      }
      case 'enum': {
        const v = typeof spec.values[0] === 'number' ? Number(value) : String(value);
        return spec.values.includes(v) ? v : undefined;
      }
      case 'string':
        return String(value);
      case 'object':
        return typeof value === 'object' ? value : undefined;
      default:
        return undefined;
    }
  }

  function resolveSettings(schema, stored, query) {
    const out = {};
    for (const [key, spec] of Object.entries(schema)) {
      let v = coerce(spec, stored && stored[key]);
      if (spec.type !== 'object' && query && query[key] !== undefined) {
        const q = coerce(spec, query[key]);
        if (q !== undefined) v = q;
      }
      out[key] = v === undefined ? spec.default : v;
    }
    return out;
  }

    let settings = raw.settings;
    for (let v = raw.version; v < version; v++) {

      settings = m(settings);

    return settings;

    {"code":"450000","name":"宮崎県","enName":"Miyazaki","pref":"宮崎県"},
    {"code":"460040","name":"奄美地方","enName":"Amami","pref":"鹿児島県"},
    {"code":"460100","name":"鹿児島県（奄美地方除く）","enName":"Kagoshima (Excluding Amami)","pref":"鹿児島県"},
    {"code":"471000","name":"沖縄本島地方","enName":"Okinawa Main Island","pref":"沖縄県"},
    {"code":"472000","name":"大東島地方","enName":"Daitojima","pref":"沖縄県"},
    {"code":"473000","name":"宮古島地方","enName":"Miyakojima","pref":"沖縄県"},
    {"code":"474000","name":"八重山地方","enName":"Yaeyama","pref":"沖縄県"}
  ];

  function guessJmaOffices(admin1) {
    if (typeof admin1 !== 'string') return [];
    return JMA_OFFICES.filter((o) => o.pref === admin1);
  }

  // 複数の府県予報区を持つ都道府県の、各予報区の代表座標(おおよそ)。最も近い区を既定にする。
  const JMA_OFFICE_CENTERS = {
    '011000': [45.42, 141.67], '012000': [43.77, 142.37], '013000': [43.80, 143.89], '014030': [42.92, 143.20],
    '014100': [42.98, 144.38], '015000': [42.32, 140.97], '016000': [43.06, 141.35], '017000': [41.77, 140.73],
    '460040': [28.38, 129.49], '460100': [31.60, 130.56],
    '471000': [26.21, 127.68], '472000': [25.83, 131.23], '473000': [24.80, 125.28], '474000': [24.34, 124.16],
  };

  function pickJmaOffice(candidates, lat, lon) {
    if (!Array.isArray(candidates) || candidates.length === 0) return null;
    if (candidates.length === 1 || !Number.isFinite(lat) || !Number.isFinite(lon)) return candidates[0];
    let best = candidates[0];
    let bestD = Infinity;
    for (const c of candidates) {
      const ctr = JMA_OFFICE_CENTERS[c.code];
      if (!ctr) continue;
      const d = (ctr[0] - lat) ** 2 + ((ctr[1] - lon) * Math.cos((lat * Math.PI) / 180)) ** 2;
      if (d < bestD) { bestD = d; best = c; }
    }
    return best;
  }

  function findOffice(code) {
    return JMA_OFFICES.find((o) => o.code === code);
  }

  function toNum(s) {
    if (s === null || s === undefined || s === '') return null;
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  function cleanText(s) {
    return typeof s === 'string' ? s.replace(/　+/g, ' ').trim() : null;
  }

  function pickArea(series, code) {
    if (!series || !Array.isArray(series.areas) || series.areas.length === 0) return null;
    return series.areas.find((a) => a.area && a.area.code === code) || series.areas[0];
  }

  function normalizeJma(json, class10Code) {
    const main = Array.isArray(json) ? json[0] : null;
    const week = Array.isArray(json) ? json[1] : null;
    const out = { reportTime: main?.reportDatetime ?? null, areaName: null, days: [], pops: [], weekly: [] };
    if (!main || !Array.isArray(main.timeSeries)) return out;

    const ts0 = main.timeSeries[0];
    const a0 = pickArea(ts0, class10Code);
    if (a0) {
      out.areaName = a0.area?.name ?? null;
      out.days = (ts0.timeDefines || []).map((t, i) => {
        const code = a0.weatherCodes?.[i] ?? null;
        return {
          date: t.slice(0, 10),
          code,
          icon: jmaCodeToIcon(code),
          weather: cleanText(a0.weathers?.[i]),
          wind: cleanText(a0.winds?.[i]),
          wave: cleanText(a0.waves?.[i]),
        };
      });
    }

    const ts1 = main.timeSeries[1];
    const a1 = pickArea(ts1, class10Code);
    if (a1) {
      out.pops = (ts1.timeDefines || []).map((t, i) => ({ time: t.slice(0, 16), pop: toNum(a1.pops?.[i]) }));
    }

    if (week && Array.isArray(week.timeSeries)) {
      const w0 = week.timeSeries[0];
      const w1 = week.timeSeries[1];
      const wa = pickArea(w0, class10Code);
      // 気温は天気と同じ並び順の地点を使う(無ければ先頭)
      const wIndex = wa && Array.isArray(w0.areas) ? Math.max(0, w0.areas.indexOf(wa)) : 0;
      const ta = w1?.areas?.[wIndex] ?? w1?.areas?.[0];
      if (w0 && wa) {
        out.weekly = (w0.timeDefines || []).map((t, i) => {
          const code = wa.weatherCodes?.[i] ?? null;
          return {
            date: t.slice(0, 10),
            code,
            icon: jmaCodeToIcon(code),
            pop: toNum(wa.pops?.[i]),
            tMin: toNum(ta?.tempsMin?.[i]),
            tMax: toNum(ta?.tempsMax?.[i]),
          };
        });
      }
    }
    return out;
  }

  function normalizeOpenMeteo(json) {
    const out = { current: null, hourly: [], daily: [] };
    if (!json || typeof json !== 'object') return out;
    const c = json.current;
    if (c && typeof c === 'object') {
      out.current = {
        time: c.time ?? null,
        temp: toNum(c.temperature_2m),
        humidity: toNum(c.relative_humidity_2m),
        apparent: toNum(c.apparent_temperature),
        windSpeed: toNum(c.wind_speed_10m),
        windDir: toNum(c.wind_direction_10m),
        code: toNum(c.weather_code),
        isDay: c.is_day === undefined ? true : Number(c.is_day) === 1,
      };
    }
    const h = json.hourly;
    if (h && Array.isArray(h.time)) {
      out.hourly = h.time.map((t, i) => ({
        time: t,
        temp: toNum(h.temperature_2m?.[i]),
        pop: toNum(h.precipitation_probability?.[i]),
        precip: toNum(h.precipitation?.[i]),
        code: toNum(h.weather_code?.[i]),
      }));
    }
    const d = json.daily;
    if (d && Array.isArray(d.time)) {
      out.daily = d.time.map((t, i) => {
        const code = toNum(d.weather_code?.[i]);
        return {
          date: t,
          code,
          icon: wmoCodeToIcon(code),
          tMax: toNum(d.temperature_2m_max?.[i]),
          tMin: toNum(d.temperature_2m_min?.[i]),
          pop: toNum(d.precipitation_probability_max?.[i]),
        };
      });
    }
    return out;
  }

  function aggregateHourly(hourly, step, nowIso, count) {
    if (!Array.isArray(hourly) || hourly.length === 0) return [];
    const nowHour = Number.parseInt(nowIso.slice(11, 13), 10);
    const startHour = Math.floor(nowHour / step) * step;
    const startKey = `${nowIso.slice(0, 10)}T${String(startHour).padStart(2, '0')}:00`;
    let i = hourly.findIndex((h) => h.time >= startKey);
    if (i < 0) return [];
    const out = [];
    while (out.length < count && i < hourly.length) {
      const chunk = hourly.slice(i, i + step);
      const pops = chunk.map((c) => c.pop).filter((p) => p !== null);
      const precip = chunk.reduce((s, c) => s + (c.precip ?? 0), 0);
      out.push({
        time: chunk[0].time,
        temp: chunk[0].temp,
        pop: pops.length ? Math.max(...pops) : null,
        precip: Math.round(precip * 10) / 10,
        icon: worstIcon(chunk.map((c) => wmoCodeToIcon(c.code))),
      });
      i += step;
    }
    return out;
  }

  function addDays(dateStr, n) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  }

  function mergeForecast(jma, om, nowIso, opts) {
    const today = nowIso.slice(0, 10);
    const jmaToday = jma ? (jma.days.find((d) => d.date === today) || jma.days[0] || null) : null;
    const cur = om?.current ?? null;

    const current = {
      temp: cur?.temp ?? null,
      humidity: cur?.humidity ?? null,
      apparent: cur?.apparent ?? null,
      windSpeed: cur?.windSpeed ?? null,
      windDir: cur?.windDir ?? null,
      isDay: cur ? cur.isDay : true,
      code: cur?.code ?? null,
      icon: cur ? wmoCodeToIcon(cur.code) : (jmaToday ? jmaToday.icon : 'unknown'),
      text: jmaToday?.weather ?? null,
      wind: jmaToday?.wind ?? null,
      wave: jmaToday?.wave ?? null,
    };

    const popByTime = new Map((jma?.pops ?? []).map((p) => [p.time, p.pop]));
    const hourly = (om ? aggregateHourly(om.hourly, opts.step, nowIso, opts.count) : [])
      .map((h) => ({ ...h, jmaPop: popByTime.has(h.time) ? popByTime.get(h.time) : null }));

    const daily = [];
    for (let i = 0; i < opts.days; i++) {
      const date = addDays(today, i);
      const w = jma?.weekly.find((x) => x.date === date) ?? null;
      const jd = jma?.days.find((x) => x.date === date) ?? null;
      const o = om?.daily.find((x) => x.date === date) ?? null;
      const pick = (jVal, oVal) => (jVal !== null && jVal !== undefined ? [jVal, false] : [oVal ?? null, oVal !== null && oVal !== undefined]);
      const jIcon = w?.code ? w.icon : (jd?.code ? jd.icon : null);
      const [icon, fIcon] = pick(jIcon, o?.icon);
      const [tMax, fMax] = pick(w?.tMax, o?.tMax);
      const [tMin, fMin] = pick(w?.tMin, o?.tMin);
      const [pop, fPop] = pick(w?.pop, o?.pop);
      daily.push({ date, icon: icon ?? 'unknown', tMax, tMin, pop, fromFallback: { icon: fIcon, tMax: fMax, tMin: fMin, pop: fPop } });
    }

    return {
      current, hourly, daily,
      meta: { jmaReportTime: jma?.reportTime ?? null, omTime: cur?.time ?? null, jmaOk: !!jma, omOk: !!om },
    };
  }

  function validLocation(obj) {
    if (!obj || typeof obj !== 'object') return null;
    const lat = toNum(obj.lat);
    const lon = toNum(obj.lon);
    if (lat === null || lon === null || Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
    const office = typeof obj.jmaOffice === 'string' && findOffice(obj.jmaOffice) ? obj.jmaOffice : null;
    const area = typeof obj.jmaClass10 === 'string' && /^\d{6}$/.test(obj.jmaClass10) ? obj.jmaClass10 : null;
    return {
      name: typeof obj.name === 'string' && obj.name ? obj.name : `${lat}, ${lon}`,
      lat, lon,
      jmaOffice: office,
      jmaClass10: office ? area : null,
      jmaClass10Name: typeof obj.jmaClass10Name === 'string' ? obj.jmaClass10Name : null,
    };
  }

  function locationFromQuery(query) {
    if (!query || query.lat === undefined || query.lon === undefined) return null;
    return validLocation({ name: query.name, lat: query.lat, lon: query.lon, jmaOffice: query.office, jmaClass10: query.area });
  }

  function jmaForecastUrl(office) {
    return `https://www.jma.go.jp/bosai/forecast/data/forecast/${office}.json`;
  }

  function openMeteoUrl(lat, lon) {
    const p = new URLSearchParams({
      latitude: String(lat), longitude: String(lon), timezone: 'Asia/Tokyo', forecast_days: '7',
      current: 'temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,weather_code,is_day',
      hourly: 'temperature_2m,precipitation_probability,precipitation,weather_code',
      daily: 'temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max',
    });
    return `https://api.open-meteo.com/v1/forecast?${p}`;
  }

  function geocodingUrl(name) {
    const p = new URLSearchParams({ name, language: 'ja', count: '10' });
    return `https://geocoding-api.open-meteo.com/v1/search?${p}`;
  }

  function toLocalIso(d) {
    const z = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;
  }

  const ZOOM_MIN = 50;
  const ZOOM_MAX = 200;
  const ZOOM_STEP = 10;

  function stepZoom(current, dir) {
    const base = Number.isFinite(current) ? Math.round(current / ZOOM_STEP) * ZOOM_STEP : 100;
    const next = base + (dir < 0 ? -ZOOM_STEP : ZOOM_STEP);
    return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
  }

  function toggleTheme(effective) {
    return effective === 'dark' ? 'light' : 'dark';
  }

  function toggleLang(lang) {
    return lang === 'ja' ? 'en' : 'ja';
  }

  // ファイル/テキストエリア共用のインポート解析。DOM に触らない。
  function parseImport(text, version) {
    let raw;
    try {
      raw = JSON.parse(String(text));
    } catch {
      return { ok: false, reason: 'invalid_json' };
    }
    if (raw && typeof raw === 'object' && raw.version > version) return { ok: false, reason: 'unrecognized_format' };
    const settings = migrateStored(raw, version);
    if (Object.keys(settings).length === 0) return { ok: false, reason: 'unrecognized_format' };
    return { ok: true, settings };
  }


  return { VERSION, coerce, resolveSettings, migrateStored, I18N, t, detectLang, effectiveTheme, ICONS, ICON_SEVERITY, jmaCodeToIcon, wmoCodeToIcon, wmoCodeToText, worstIcon, JMA_OFFICES, guessJmaOffices, pickJmaOffice, findOffice, normalizeJma, normalizeOpenMeteo, aggregateHourly, addDays, mergeForecast, toNum, cleanText, locationFromQuery, validLocation, jmaForecastUrl, openMeteoUrl, geocodingUrl, toLocalIso, stepZoom, toggleTheme, toggleLang, parseImport };
})();

<script id="app-ui">
const App = (() => {
  const PAGE = 'weather';
  const STORAGE_KEY = `simplePages.${PAGE}`;
  const REPO_URL = 'https://github.com/ytx/simplePages';
  const ABOUT = {
    page: PAGE,
    credits: [
      { name: '気象庁 天気予報 JSON (bosai)', url: 'https://www.jma.go.jp/bosai/' },
      { name: 'Open-Meteo', url: 'https://open-meteo.com/', note: 'CC BY 4.0' },
    ],
  };
  const SCHEMA = {
    lang: { type: 'enum', values: ['ja', 'en'], default: Logic.detectLang(navigator.language) },
    theme: { type: 'enum', values: ['auto', 'light', 'dark'], default: 'auto' },
    zoom: { type: 'int', min: 50, max: 200, default: 100 },
    refreshMinutes: { type: 'int', min: 1, max: 120, default: 10 },
    hourlyStep: { type: 'enum', values: [1, 3], default: 3 },
    hourlyCount: { type: 'int', min: 6, max: 24, default: 16 },
    dailyDays: { type: 'int', min: 5, max: 7, default: 7 },
    location: { type: 'object', default: null },
  };
  const IDLE_MS = 10000;
  // 表示だけに影響する設定。変更しても再取得しない。
  // ページ側で追加する表示専用の設定キーもここに足す。
  const DISPLAY_ONLY_KEYS = new Set(['theme', 'zoom', 'lang']);

  let settings = {};
  let nextRefreshAt = 0;
  let refreshTimer = null;
  let idleTimer = null;
  let toolbarAttention = false;
  let refreshSeq = 0;

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  const storage = {
    read() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
    },
    write(s) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: Logic.VERSION, settings: s })); } catch { /* ignore */ }
    },
    clear() {
      try { localStorage.removeItem(STORAGE_KEY); } catch { /* ignore */ }
    },
  };

  function loadSettings() {
    const query = Object.fromEntries(new URLSearchParams(location.search));
    const stored = Logic.migrateStored(storage.read(), Logic.VERSION);
    settings = Logic.resolveSettings(SCHEMA, stored, query);
    settings.location = Logic.locationFromQuery(query) || Logic.validLocation(settings.location);
    if (query.save === '1') storage.write(settings);
  }

  function getSettings() { return { ...settings }; }

  function updateSettings(patch) {
    const prev = settings;
    settings = Logic.resolveSettings(SCHEMA, { ...settings, ...patch }, {});
    settings.location = Logic.validLocation(settings.location);
    if (JSON.stringify(prev.location) !== JSON.stringify(settings.location)) lastModel = null;
    storage.write(settings);
    applySettings();
    const changed = (k) => JSON.stringify(prev[k]) !== JSON.stringify(settings[k]);
    if (Object.keys(patch).some((k) => !DISPLAY_ONLY_KEYS.has(k) && changed(k))) scheduleRefresh(0);
  }

  function applyI18n() {
    document.documentElement.lang = settings.lang;
    for (const el of $$('[data-i18n]')) el.textContent = Logic.t(settings.lang, el.dataset.i18n);
    for (const el of $$('[data-i18n-label]')) el.setAttribute('aria-label', Logic.t(settings.lang, el.dataset.i18nLabel));
    // data-i18n-label ループの後に実行する: 全画面ボタンのラベルを状態に合った値で上書きするため。
    updateFullscreenButton();
  }

  function currentTheme() {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    return Logic.effectiveTheme(settings.theme, prefersDark);
  }

  function applyTheme() {
    const theme = currentTheme();
    document.documentElement.dataset.theme = theme;
    // アイコンは「切替先」を表す: ライト表示中は月、ダーク表示中は太陽。
    $('#btn-theme use').setAttribute('href', theme === 'dark' ? '#icon-light-mode' : '#icon-dark-mode');
  }

  function applyZoom(zoom) {
    document.documentElement.style.setProperty('--zoom', String(zoom / 100));
    $('#btn-zoom-in').disabled = Logic.stepZoom(zoom, 1) === zoom;
    $('#btn-zoom-out').disabled = Logic.stepZoom(zoom, -1) === zoom;
  }

  function applySettings() {
    applyI18n();
    applyTheme();
    applyZoom(settings.zoom);
    for (const el of $$('[data-setting]')) el.value = settings[el.dataset.setting];
    renderSettingsExtra(settings);
    if (lastModel) render(lastModel);
  }

  function updateFullscreenButton() {
    const btn = $('#btn-fullscreen');
    if (!document.fullscreenEnabled) { btn.hidden = true; return; }
    const on = !!document.fullscreenElement;
    btn.querySelector('use').setAttribute('href', on ? '#icon-fullscreen-exit' : '#icon-fullscreen');
    btn.setAttribute('aria-label', Logic.t(settings.lang, on ? 'exit_fullscreen' : 'fullscreen'));
  }

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { /* ユーザー操作なしで拒否された場合など。無視して現状維持 */ }
  }

  // ページ側が true にすると減光せず、設定ボタンを強調する(例: 必須設定が未入力)。
  function setToolbarAttention(on) {
    toolbarAttention = !!on;
    $('#btn-settings').classList.toggle('attention', toolbarAttention);
    if (toolbarAttention) $('#toolbar').classList.remove('idle');
    else resetIdle();
  }

  function bindToolbar() {
    $('#btn-theme').addEventListener('click', () => updateSettings({ theme: Logic.toggleTheme(currentTheme()) }));
    $('#btn-zoom-in').addEventListener('click', () => updateSettings({ zoom: Logic.stepZoom(settings.zoom, 1) }));
    $('#btn-zoom-out').addEventListener('click', () => updateSettings({ zoom: Logic.stepZoom(settings.zoom, -1) }));
    $('#btn-fullscreen').addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFullscreenButton);
    $('#btn-lang').addEventListener('click', () => updateSettings({ lang: Logic.toggleLang(settings.lang) }));
    $('#btn-settings').addEventListener('click', () => {
      const sel = $('[role="tab"][aria-selected="true"]') || $$('[role="tab"]')[0];
      showTab(sel.dataset.tab); // データタブの表示内容を最新に
      $('#settings').showModal();
    });
  }

  function setStatus(state, message) {
    $('#status-dot').dataset.state = state;
    const el = $('#status-message');
    el.dataset.state = state;
    el.textContent = message || '';
  }

  function formatTime(d) {
    return new Intl.DateTimeFormat(settings.lang === 'ja' ? 'ja-JP' : 'en-US', { hour: '2-digit', minute: '2-digit' }).format(d);
  }

  function tickClock() {
    const d = new Date();
    $('#clock').textContent = new Intl.DateTimeFormat(settings.lang === 'ja' ? 'ja-JP' : 'en-US',
      { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(d);
  }

  let lastModel = null;
  let lastOkAt = null;
  let jmaCache = null; // { office, json } 気象庁は更新が少ないので同一地点なら失敗時に再利用

  const FETCH_TIMEOUT_MS = 20000;
  async function fetchJson(url) {
    try {
      const r = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(FETCH_TIMEOUT_MS) });
      if (!r.ok) return { ok: false, error: `HTTP ${r.status}` };
      return { ok: true, data: await r.json() };
    } catch (e) {
      const reason = e && (e.name === 'TimeoutError' || e.name === 'AbortError') ? 'timeout' : (e.message || 'network');
      return { ok: false, error: reason };
    }
  }

  function locale() { return settings.lang === 'ja' ? 'ja-JP' : 'en-US'; }

  function hourlyCount() {
    return Math.min(settings.hourlyCount, window.innerHeight < 900 ? 12 : 24);
  }

  async function refresh() {
    const seq = ++refreshSeq;
    const loc = settings.location;
    $('#no-location').hidden = !!loc;
    setToolbarAttention(!loc);
    for (const p of $$('.panel')) p.hidden = !loc;
    if (!loc) { setStatus('error', Logic.t(settings.lang, 'set_location_hint')); return; }

    setStatus('busy', Logic.t(settings.lang, 'updating'));
    const tasks = [fetchJson(Logic.openMeteoUrl(loc.lat, loc.lon))];
    if (loc.jmaOffice) tasks.push(fetchJson(Logic.jmaForecastUrl(loc.jmaOffice)));
    const [omRes, jmaRes] = await Promise.all(tasks);
    if (seq !== refreshSeq) return; // 地点変更などで新しい更新が始まっていれば古い結果は捨てる
    const jmaFailed = !!loc.jmaOffice && !jmaRes.ok;
    const allFailed = !omRes.ok && (!loc.jmaOffice || jmaFailed);

    const errors = [];
    const om = omRes.ok ? Logic.normalizeOpenMeteo(omRes.data) : null;
    if (!omRes.ok) errors.push(`Open-Meteo: ${omRes.error}`);

    let jma = null;
    if (loc.jmaOffice) {
      if (jmaRes.ok) {
        jmaCache = { office: loc.jmaOffice, json: jmaRes.data };
      } else {
        errors.push(`JMA: ${jmaRes.error}`);
      }
      const cached = jmaCache && jmaCache.office === loc.jmaOffice ? jmaCache.json : null;
      if (cached) jma = Logic.normalizeJma(cached, loc.jmaClass10);
    }

    if (!errors.length) lastOkAt = new Date();
    const okText = lastOkAt ? Logic.t(settings.lang, 'updated_at', { time: formatTime(lastOkAt) }) : Logic.t(settings.lang, 'never_updated');
    if (allFailed && lastModel) {
      setStatus('error', `${okText} / ${Logic.t(settings.lang, 'error_fetch', { reason: errors.join(' / ') })}`);
      return;
    }
    const nowIso = Logic.toLocalIso(new Date());
    lastModel = Logic.mergeForecast(jma, om, nowIso, { step: settings.hourlyStep, count: hourlyCount(), days: settings.dailyDays });
    render(lastModel);
    if (errors.length) setStatus('error', `${okText} / ${Logic.t(settings.lang, 'error_fetch', { reason: errors.join(' / ') })}`);
    else setStatus('ok', okText);
  }

  function renderSettingsExtra(_settings) {
    renderLocationTab();
  }

  function getLastModel() { return lastModel; }

  let geoResults = [];
  let pendingLoc = null; // 検索で選んだがまだ保存していない地点

  function fillOfficeSelect(selectedCode) {
    const sel = $('#loc-office');
    sel.replaceChildren();
    const none = el('option', null, Logic.t(settings.lang, 'area_none'));
    none.value = '';
    sel.appendChild(none);
    for (const o of Logic.JMA_OFFICES) {
      const op = el('option', null, settings.lang === 'ja' ? o.name : o.enName);
      op.value = o.code;
      sel.appendChild(op);
    }
    sel.value = selectedCode || '';
  }

  let areaReq = 0;
  async function fillAreaSelect(officeCode, selectedCode) {
    const sel = $('#loc-area');
    const req = ++areaReq;
    sel.disabled = !officeCode;
    if (!officeCode) { sel.replaceChildren(); sel.dataset.office = ''; return; }
    const res = await fetchJson(Logic.jmaForecastUrl(officeCode));
    if (req !== areaReq) return; // 古い応答は捨てる
    if (!res.ok) { sel.replaceChildren(); setStatus('error', Logic.t(settings.lang, 'error_fetch', { reason: `JMA: ${res.error}` })); return; }
    const areas = res.data?.[0]?.timeSeries?.[0]?.areas ?? [];
    const opts = areas.map((a) => { const op = el('option', null, a.area.name); op.value = a.area.code; op.dataset.name = a.area.name; return op; });
    sel.replaceChildren(...opts);
    sel.dataset.office = officeCode;
    sel.value = selectedCode && areas.some((a) => a.area.code === selectedCode) ? selectedCode : (areas[0]?.area.code ?? '');
  }

  function renderLocationTab() {
    const loc = settings.location;
    $('#loc-query').placeholder = Logic.t(settings.lang, 'search_placeholder');
    fillOfficeSelect(loc?.jmaOffice);
    const areaSel = $('#loc-area');
    if ((loc?.jmaOffice || '') !== (areaSel.dataset.office || '') || areaSel.options.length === 0) {
      fillAreaSelect(loc?.jmaOffice, loc?.jmaClass10);
    } else if (loc?.jmaClass10) {
      areaSel.value = loc.jmaClass10;
    }
    $('#loc-current').textContent = loc
      ? `${loc.name} (${loc.lat.toFixed(3)}, ${loc.lon.toFixed(3)})${loc.jmaClass10Name ? ` / ${loc.jmaClass10Name}` : ''}`
      : '';
  }

  function commitLocation(patch) {
    const base = pendingLoc || settings.location || {};
    const loc = Logic.validLocation({ ...base, ...patch });
    if (!loc) return;
    const areaOp = $('#loc-area').selectedOptions[0];
    loc.jmaClass10Name = loc.jmaClass10 && areaOp && areaOp.value === loc.jmaClass10 ? areaOp.dataset.name : null;
    pendingLoc = null;
    updateSettings({ location: loc });
  }

  function bindLocationTab() {
    const hint = $('#loc-hint');
    const results = $('#loc-results');

    let searchReq = 0;
    async function search() {
      const q = $('#loc-query').value.trim();
      if (!q) return;
      const req = ++searchReq;
      hint.hidden = true;
      const res = await fetchJson(Logic.geocodingUrl(q));
      if (req !== searchReq) return;
      results.replaceChildren();
      geoResults = res.ok ? (res.data.results || []) : [];
      if (!res.ok) { hint.textContent = Logic.t(settings.lang, 'error_fetch', { reason: res.error }); hint.hidden = false; return; }
      if (geoResults.length === 0) { hint.textContent = `${Logic.t(settings.lang, 'no_results')} — ${Logic.t(settings.lang, 'search_hint')}`; hint.hidden = false; return; }
      geoResults.forEach((r, i) => {
        const parts = [r.name, r.admin1, r.country_code !== 'JP' ? r.country : null].filter(Boolean);
        const op = el('option', null, parts.join(' / '));
        op.value = String(i);
        results.appendChild(op);
      });
    }

    $('#loc-search').addEventListener('click', search);
    $('#loc-query').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); search(); } });

    results.addEventListener('change', async () => {
      const r = geoResults[Number(results.value)];
      if (!r) return;
      const offices = r.country_code === 'JP' ? Logic.guessJmaOffices(r.admin1) : [];
      const office = Logic.pickJmaOffice(offices, r.latitude, r.longitude)?.code ?? null;
      pendingLoc = { name: r.name, lat: r.latitude, lon: r.longitude, jmaOffice: office, jmaClass10: null, jmaClass10Name: null };
      fillOfficeSelect(office);
      await fillAreaSelect(office, null);
      if (office && $('#loc-area').dataset.office !== office) return;
      commitLocation({ jmaClass10: $('#loc-area').value || null });
    });

    $('#loc-office').addEventListener('change', async () => {
      const office = $('#loc-office').value || null;
      await fillAreaSelect(office, null);
      if (office && $('#loc-area').dataset.office !== office) return;
      commitLocation({ jmaOffice: office, jmaClass10: $('#loc-area').value || null });
    });

    $('#loc-area').addEventListener('change', () => {
      commitLocation({ jmaOffice: $('#loc-office').value || null, jmaClass10: $('#loc-area').value || null });
    });
  }

  function iconSvg(id, cls) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', cls || 'icon');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', `#icon-${id}`);
    svg.appendChild(use);
    return svg;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function fmtNum(v, unit, digits) {
    if (v === null || v === undefined) return '--';
    return `${Number(v).toFixed(digits ?? 0)}${unit || ''}`;
  }

  function windDirText(deg) {
    if (deg === null || deg === undefined) return '';
    const ja = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
    const en = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    const i = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
    return (settings.lang === 'ja' ? ja : en)[i];
  }

  function renderCurrent(c) {
    const loc = settings.location;
    const office = loc?.jmaOffice ? Logic.findOffice(loc.jmaOffice) : null;
    const area = typeof loc?.jmaClass10Name === 'string' && loc.jmaClass10Name ? ` ${loc.jmaClass10Name}` : '';
    const name = loc ? loc.name + (office ? ` / ${settings.lang === 'ja' ? office.name : office.enName}${area}` : '') : '';
    $('#page-title').textContent = name;
    const night = !c.isDay && (c.icon === 'sunny' || c.icon === 'sunny-cloudy');
    $('#cur-icon').firstElementChild.setAttribute('href', `#icon-${c.icon}${night ? '-night' : ''}`);
    $('#cur-temp').replaceChildren(document.createTextNode(c.temp === null ? '--' : Math.round(c.temp)), el('small', null, '°C'));
    const text = settings.lang === 'ja' ? (c.text ?? Logic.wmoCodeToText('ja', c.code)) : (Logic.wmoCodeToText('en', c.code) || c.text || '');
    $('#cur-text').textContent = text;
    $('#cur-humidity').textContent = `${Logic.t(settings.lang, 'humidity')} ${fmtNum(c.humidity, '%')}`;
    $('#cur-apparent').textContent = fmtNum(c.apparent, '°C');
    const windParts = [];
    if (c.wind && settings.lang === 'ja') windParts.push(c.wind);
    if (c.windSpeed !== null) windParts.push(`${windDirText(c.windDir)} ${fmtNum(c.windSpeed, ' km/h')}`.trim());
    $('#cur-wind').textContent = windParts.join(' / ') || '--';
    $('#cur-wave').textContent = c.wave ?? '--';
  }

  function renderHourly(items) {
    const grid = $('#hourly-grid');
    grid.replaceChildren();
    const n = Math.max(items.length, 1);
    grid.style.setProperty('--cols', n);
    const rows = { time: el('div', 'cols'), icon: el('div', 'cols'), temp: el('div', 'cols'), pop: el('div', 'cols'), precip: el('div', 'cols') };
    for (const r of Object.values(rows)) r.style.setProperty('--cols', n);
    let prevDate = null;
    for (const h of items) {
      const date = h.time.slice(0, 10);
      const hour = Number.parseInt(h.time.slice(11, 13), 10);
      const dayStart = date !== prevDate;
      prevDate = date;
      const label = dayStart ? new Intl.DateTimeFormat(locale(), { month: 'numeric', day: 'numeric' }).format(new Date(`${date}T00:00`)) + ` ${hour}` : String(hour);
      rows.time.appendChild(el('div', 'time' + (dayStart ? ' day-start' : ''), label));
      const ic = el('div', null); ic.appendChild(iconSvg(h.icon)); rows.icon.appendChild(ic);
      rows.temp.appendChild(el('div', 'temp', fmtNum(h.temp, '°')));
      const pop = el('div', 'pop', fmtNum(h.pop, '%'));
      if (h.jmaPop !== null) { pop.appendChild(document.createTextNode(' ')); pop.appendChild(el('small', null, `(${h.jmaPop})`)); }
      rows.pop.appendChild(pop);
      rows.precip.appendChild(el('div', 'precip', h.precip ? fmtNum(h.precip, 'mm', 1) : ''));
    }
    for (const r of Object.values(rows)) grid.appendChild(r);
    renderHourlyLegend();
    renderHourlyChart(items);
  }

  function renderHourlyLegend() {
    const legend = $('#hourly-legend');
    legend.replaceChildren(el('span', 'chart-title', Logic.t(settings.lang, 'chart_title')));
    for (const [cls, key] of [['temp', 'temp'], ['pop', 'pop'], ['precip', 'precip']]) {
      const item = el('span', 'legend-item');
      item.appendChild(el('span', `sw ${cls}`));
      item.appendChild(document.createTextNode(Logic.t(settings.lang, key)));
      legend.appendChild(item);
    }
  }

  function renderHourlyChart(items) {
    const svg = $('#hourly-chart');
    svg.replaceChildren();
    const n = items.length;
    const W = 100 * Math.max(n, 1), H = 100;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    if (n === 0) return;
    const ns = 'http://www.w3.org/2000/svg';
    const mk = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
    const temps = items.map((h) => h.temp).filter((v) => v !== null);
    const tMin = temps.length ? Math.min(...temps) - 1 : 0;
    const tMax = temps.length ? Math.max(...temps) + 1 : 1;
    const tY = (t) => 8 + (1 - (t - tMin) / (tMax - tMin || 1)) * 50; // 気温は上 8〜58
    const maxPrecip = Math.max(5, ...items.map((h) => h.precip ?? 0));
    for (const y of [tY(tMax), tY(tMin)]) svg.appendChild(mk('line', { x1: 0, x2: W, y1: y, y2: y, class: 'grid' }));
    items.forEach((h, i) => {
      const x = i * 100;
      if (h.pop !== null) svg.appendChild(mk('rect', { x: x + 15, width: 70, y: H - 38 * (h.pop / 100), height: 38 * (h.pop / 100), class: 'pop-bar' }));
      if (h.precip) svg.appendChild(mk('rect', { x: x + 35, width: 30, y: H - 38 * (h.precip / maxPrecip), height: 38 * (h.precip / maxPrecip), class: 'precip-bar' }));
    });
    const pts = items.map((h, i) => (h.temp === null ? null : `${i * 100 + 50},${tY(h.temp)}`)).filter(Boolean).join(' ');
    svg.appendChild(mk('polyline', { points: pts, class: 'temp-line' }));
  }

  function renderWeekly(days, meta) {
    const grid = $('#weekly-grid');
    grid.replaceChildren();
    grid.style.setProperty('--cols', Math.max(days.length, 1));
    const today = Logic.toLocalIso(new Date()).slice(0, 10);
    for (const d of days) {
      const col = el('div');
      const dt = new Date(`${d.date}T00:00`);
      const wd = dt.getDay();
      let label = new Intl.DateTimeFormat(locale(), { month: 'numeric', day: 'numeric', weekday: 'short' }).format(dt);
      if (d.date === today) label = Logic.t(settings.lang, 'today');
      else if (d.date === Logic.addDays(today, 1)) label = Logic.t(settings.lang, 'tomorrow');
      col.appendChild(el('div', 'date' + (wd === 0 || wd === 6 ? ' weekend' : ''), label));
      const ic = iconSvg(d.icon, 'icon' + (d.fromFallback.icon ? ' fallback' : ''));
      col.appendChild(ic);
      const temps = el('div', 'temps');
      const hi = el('b', d.fromFallback.tMax ? 'fallback' : null, fmtNum(d.tMax, '°'));
      const lo = el('i', d.fromFallback.tMin ? 'fallback' : null, fmtNum(d.tMin, '°'));
      temps.append(hi, document.createTextNode(' / '), lo);
      col.appendChild(temps);
      col.appendChild(el('div', 'pop' + (d.fromFallback.pop ? ' fallback' : ''), fmtNum(d.pop, '%')));
      grid.appendChild(col);
    }
    $('#jma-report').textContent = meta.jmaReportTime
      ? Logic.t(settings.lang, 'jma_report', { time: meta.jmaReportTime.slice(5, 16).replace('T', ' ') })
      : '';
  }

  function render(model) {
    renderCurrent(model.current);
    renderHourly(model.hourly);
    renderWeekly(model.daily, model.meta);
  }

  function scheduleRefresh(delayMs) {
    clearTimeout(refreshTimer);
    const delay = delayMs ?? settings.refreshMinutes * 60000;
    nextRefreshAt = Date.now() + delay;
    refreshTimer = setTimeout(async () => {
      try { await refresh(); } finally { scheduleRefresh(); }
    }, delay);
  }

  function onVisibility() {
    if (document.visibilityState === 'visible' && Date.now() >= nextRefreshAt) scheduleRefresh(0);
  }

  function resetIdle() {
    $('#toolbar').classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (!toolbarAttention) $('#toolbar').classList.add('idle'); }, IDLE_MS);
  }

  function showTab(name) {
    for (const t2 of $$('[role="tab"]')) t2.setAttribute('aria-selected', String(t2.dataset.tab === name));
    for (const p of $$('.tab-panel')) p.classList.toggle('active', p.dataset.panel === name);
    if (name === 'data') refreshDataText();
  }

  function refreshDataText() {
    $('#data-text').value = JSON.stringify({ version: Logic.VERSION, settings }, null, 2);
    setDataMessage('none', '');
  }

  function setDataMessage(state, text) {
    const el = $('#data-message');
    el.dataset.state = state;
    el.textContent = text;
  }

  function importText(text) {
    const result = Logic.parseImport(text, Logic.VERSION);
    if (!result.ok) {
      setDataMessage('error', Logic.t(settings.lang, result.reason === 'invalid_json' ? 'import_failed_json' : 'import_failed_format'));
      return;
    }
    updateSettings(result.settings);
    refreshDataText();
    setDataMessage('ok', Logic.t(settings.lang, 'import_ok'));
  }

  function renderAbout() {
    $('#about-page').href = `${REPO_URL}/tree/main/${ABOUT.page}`;
    const list = $('#about-credits');
    const icons = list.firstElementChild; // credit_icons の li は残す
    list.replaceChildren(...(icons ? [icons] : []));
    for (const c of ABOUT.credits) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = c.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = c.name;
      li.appendChild(a);
      if (c.note) li.appendChild(document.createTextNode(` — ${c.note}`));
      list.appendChild(li);
    }
  }

  function bindSettingsDialog() {
    const dlg = $('#settings');
    $('#settings-close').addEventListener('click', () => dlg.close());
    // 背景クリックで閉じる。テキスト選択などで内側から押して背景で離した場合は閉じない。
    let downOnBackdrop = false;
    dlg.addEventListener('pointerdown', (ev) => { downOnBackdrop = ev.target === dlg; });
    dlg.addEventListener('click', (ev) => {
      if (downOnBackdrop && ev.target === dlg) dlg.close();
      downOnBackdrop = false;
    });
    for (const tab of $$('[role="tab"]')) tab.addEventListener('click', () => showTab(tab.dataset.tab));
    for (const el of $$('[data-setting]')) {
      el.addEventListener('change', () => updateSettings({ [el.dataset.setting]: el.value }));
    }
    $('#btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ version: Logic.VERSION, settings }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const d = new Date();
      const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      a.download = `simplePages-${PAGE}-${ymd}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    $('#btn-import').addEventListener('click', () => $('#import-file').click());
    $('#import-file').addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      if (file) importText(await file.text());
      ev.target.value = '';
    });
    $('#btn-import-text').addEventListener('click', () => importText($('#data-text').value));
    $('#btn-clear').addEventListener('click', () => {
      if (!confirm(Logic.t(settings.lang, 'confirm_clear'))) return;
      storage.clear();
      location.href = location.pathname;
    });
    renderAbout();
  }

  function init() {
    loadSettings();
    bindSettingsDialog();
    bindToolbar();
    bindLocationTab();
    applySettings();
    scheduleRefresh(0);
    tickClock();
    setInterval(tickClock, 1000);
    document.addEventListener('visibilitychange', onVisibility);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    for (const ev of ['pointermove', 'pointerdown', 'touchstart', 'keydown']) document.addEventListener(ev, resetIdle, { passive: true });
    resetIdle();
    let resizeTimer = null;
    let lastHourlyCount = hourlyCount();
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const n = hourlyCount();
        if (n !== lastHourlyCount) { lastHourlyCount = n; if (lastModel) scheduleRefresh(0); }
      }, 500);
    });
  }

  document.addEventListener('DOMContentLoaded', init);

  return { getSettings, updateSettings, setStatus, scheduleRefresh, refresh, render, getLastModel, applyZoom, setToolbarAttention };
})();
</script>
</body>
</html>
