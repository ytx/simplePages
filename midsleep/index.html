<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>midsleep</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#5b6ee1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="midsleep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  --bg: #fbfbfd;
  --bg-panel: #ffffff;
  --fg: #1c1f2b;
  --fg-muted: #5c6070;
  --border: #dcdde6;
  --accent: #5b6ee1;
  --on-accent: #fff;
  --ok: #2fa84f;
  --warn: #e6a700;
  --error: #d64545;
  --zoom: 1;
  --radius: 10px;
  --gap: calc(clamp(8px, 1vw, 16px) * var(--zoom));
  --fs-base: calc(clamp(16px, 1.2vw, 20px) * var(--zoom));
  --fs-small: calc(var(--fs-base) * 0.8);
  --fs-large: calc(var(--fs-base) * 1.6);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
html[data-theme="dark"] {
  --bg: #13141b;
  --bg-panel: #1c1e28;
  --fg: #e8e9f0;
  --fg-muted: #9b9fb2;
  --border: #2e3040;
  --accent: #8c9bf5;
  --on-accent: #13141b;
}
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --bg: #13141b; --bg-panel: #1c1e28; --fg: #e8e9f0; --fg-muted: #9b9fb2; --border: #2e3040; --accent: #8c9bf5; --on-accent: #13141b;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-base);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#toolbar {
  display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--gap) / 2);
  padding: calc(var(--gap) / 2) var(--gap);
  transition: opacity 0.6s;
}
#toolbar.idle { opacity: 0.15; }
.icon-btn {
  width: 2.2em; height: 2.2em; min-width: 44px; min-height: 44px; flex: none; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-panel); color: var(--fg);
  cursor: pointer; display: grid; place-items: center; padding: 0; font: inherit;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 1.3em; height: 1.3em; fill: currentColor; }
.icon-btn.attention { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
#content { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 var(--gap); }
#page-title { margin: 0 0 calc(var(--gap) / 2); text-align: left; font-size: var(--fs-base); font-weight: 400; color: var(--fg-muted); }
.tab-pane { display: none; }
.tab-pane.active { display: block; flex: 1; min-height: 0; position: relative; overflow: auto; padding-bottom: var(--gap); }
#status-bar {
  display: flex; justify-content: center; align-items: center; gap: var(--gap);
  padding: calc(var(--gap) / 2) var(--gap);
  border-top: 1px solid var(--border);
  font-size: var(--fs-small); color: var(--fg-muted);
}
#status-dot {
  width: 0.7em; height: 0.7em; border-radius: 50%;
  background: var(--fg-muted);
}
#status-dot[data-state="ok"] { background: var(--ok); }
#status-dot[data-state="warn"] { background: var(--warn); }
#tabbar { display: flex; border-top: 1px solid var(--border); background: var(--bg-panel); }
.tab {
  flex: 1; min-height: max(70px, 4.5em); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: none; border: none; color: var(--fg-muted); cursor: pointer; font: inherit; font-size: var(--fs-small); padding: 4px 0;
}
.tab svg { width: 2em; height: 2em; fill: currentColor; }
.tab[aria-selected="true"] { color: var(--accent); }
dialog#dialog, dialog#sheet {
  background: var(--bg-panel); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius);
  width: min(90vw, 24em); padding: var(--gap); display: none;
}
dialog#dialog[open], dialog#sheet[open] { display: block; }
dialog#dialog::backdrop, dialog#sheet::backdrop { background: rgba(0,0,0,0.5); }
#dialog-message { margin: 0 0 var(--gap); white-space: pre-wrap; }
#dialog-input { width: 100%; margin-bottom: var(--gap); }
#dialog-input[hidden] { display: none; }
#sheet-title { margin: 0 0 var(--gap); font-size: var(--fs-base); font-weight: 400; outline: none; }
#sheet-body { margin-bottom: var(--gap); }
#sheet-body [hidden] { display: none; }
#sheet-delete:disabled { opacity: 0.4; cursor: default; }
.dialog-actions { display: flex; justify-content: flex-end; gap: calc(var(--gap) / 2); }
.sheet-label { color: var(--fg-muted); font-size: var(--fs-small); margin: calc(var(--gap) / 2) 0 calc(var(--gap) / 4); }
.sheet-error { color: var(--error); min-height: 1.4em; }
.settings-section { border-bottom: 1px solid var(--border); padding: calc(var(--gap) / 2) 0; }
.settings-section > summary { cursor: pointer; padding: calc(var(--gap) / 2) 0; list-style-position: inside; min-height: 44px; }
.settings-section > :not(summary) { margin-left: 0; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); align-items: center; margin-bottom: var(--gap); }
.field > input, .field > select { width: 100%; min-width: 0; box-sizing: border-box; }
.field label { color: var(--fg-muted); }
select, input, textarea, button.btn {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.4em 0.6em;
}
textarea { width: 100%; resize: vertical; }
input, select, textarea { font-size: max(16px, var(--fs-base)); }
input, select { min-height: 44px; }
textarea#data-text { min-height: 10em; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: max(16px, var(--fs-small)); }
button.btn { cursor: pointer; min-height: 44px; }
button.btn.danger { color: var(--error); }
button.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.btn[hidden] { display: none; }
.today-date { color: var(--fg-muted); }
.today-target { margin-bottom: var(--gap); }
.today-hint { color: var(--fg-muted); margin: var(--gap) 0; }
.advice-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--gap); margin-bottom: var(--gap); }
.advice-card.warn-card { border-color: var(--error); }
.advice-title { color: var(--fg-muted); font-size: var(--fs-small); }
.advice-big { font-size: calc(var(--fs-base) * 2); font-weight: 400; color: var(--accent); line-height: 1.3; }
.advice-sub { color: var(--fg); }
.advice-sub.warn { color: var(--error); }
.advice-sub.muted { color: var(--fg-muted); }
.advice-row { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--gap) / 2); }
.advice-row .icon-btn { min-width: 44px; min-height: 44px; }
.card-actions { display: flex; flex-wrap: wrap; gap: calc(var(--gap) / 2); margin-top: calc(var(--gap) / 2); }
.big-btn { display: block; width: 100%; min-height: 4em; margin: var(--gap) 0; font: inherit; font-size: calc(var(--fs-base) * 1.4); color: var(--on-accent); background: var(--accent); border: 1px solid var(--accent); border-radius: var(--radius); cursor: pointer; }
.big-btn.alt { background: var(--ok); border-color: var(--ok); }
.big-btn[hidden] { display: none; }
.today-last { color: var(--fg-muted); margin-top: var(--gap); }
.link-btn { font: inherit; color: var(--accent); background: none; border: 0; padding: 0.5em 0.25em; min-height: 44px; cursor: pointer; text-decoration: underline; }
.link-row { display: flex; flex-wrap: wrap; gap: var(--gap); margin-top: calc(var(--gap) / 2); }
#sheet-body input[type=datetime-local] { width: 100%; min-height: 44px; margin-bottom: calc(var(--gap) / 3); }
#sheet-ok:disabled { opacity: 0.4; cursor: default; }
.seg-group { display: flex; gap: calc(var(--gap) / 2); margin-bottom: calc(var(--gap) / 2); }
button.seg { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; min-height: 44px; padding: 0 var(--gap); cursor: pointer; }
button.seg[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
#history-chart { display: block; max-width: 720px; margin: calc(var(--gap) / 2) 0; }
#history-chart text { font-size: 9px; fill: var(--fg-muted); font-family: inherit; }
#history-list { list-style: none; margin: var(--gap) 0 0; padding: 0; }
#history-list li { border-top: 1px solid var(--border); }
#history-list li button.history-item { display: block; width: 100%; min-height: 44px; text-align: left; font: inherit; color: var(--fg); background: none; border: 0; padding: calc(var(--gap) / 2) 0; cursor: pointer; }
.history-date { color: var(--fg-muted); font-size: var(--fs-small); }
.history-empty { color: var(--fg-muted); padding: calc(var(--gap) / 2) 0; }
.row { display: flex; gap: var(--gap); flex-wrap: wrap; align-items: center; }
.hint { color: var(--fg-muted); font-size: var(--fs-small); margin: calc(var(--gap) / 2) 0; }
#data-message { min-height: 1.4em; margin-top: calc(var(--gap) / 2); }
#data-message[data-state="error"] { color: var(--error); }
.about h3 { margin: var(--gap) 0 calc(var(--gap) / 3); font-size: var(--fs-base); font-weight: 400; }
.about ul { margin: 0; padding-left: 1.2em; }
.about a { color: var(--accent); }
</style>
</head>
<body>

<header id="toolbar">
  <button id="btn-theme" class="icon-btn" type="button" data-i18n-label="toggle_theme"><svg aria-hidden="true"><use href="#icon-dark-mode"></use></svg></button>
  <button id="btn-zoom-out" class="icon-btn" type="button" data-i18n-label="zoom_out"><svg aria-hidden="true"><use href="#icon-zoom-out"></use></svg></button>
  <button id="btn-zoom-in" class="icon-btn" type="button" data-i18n-label="zoom_in"><svg aria-hidden="true"><use href="#icon-zoom-in"></use></svg></button>
  <button id="btn-lang" class="icon-btn" type="button" data-i18n-label="toggle_lang"><svg aria-hidden="true"><use href="#icon-translate"></use></svg></button>
  <button id="btn-settings" class="icon-btn" type="button" data-i18n-label="settings"><svg aria-hidden="true"><use href="#icon-settings"></use></svg></button>
</header>
<main id="content">
  <h1 id="page-title" data-i18n="page_title"></h1>
  <section class="tab-pane active" id="tab-today">
    <div id="today-body"></div>
    <button id="btn-sleep" class="big-btn" type="button" hidden></button>
    <button id="btn-wake" class="big-btn alt" type="button" hidden></button>
    <div id="today-foot"></div>
  </section>
  <section class="tab-pane" id="tab-history">
    <div id="chart-days" class="seg-group" role="group">
      <button type="button" class="seg" data-days="14" data-i18n="days_14"></button>
      <button type="button" class="seg" data-days="30" data-i18n="days_30"></button>
    </div>
    <div id="history-stats" class="hint"></div>
    <svg id="history-chart" viewBox="0 0 360 240" width="100%" role="img"></svg>
    <button type="button" id="history-add" class="btn"></button>
    <ul id="history-list"></ul>
  </section>
  <section class="tab-pane" id="tab-settings">
    <details class="settings-section" data-section="display" open>
      <summary data-i18n="section_display"></summary>
      <div class="field">
        <label for="set-chartDays" data-i18n="chart_days"></label>
        <select id="set-chartDays" data-setting="chartDays">
          <option value="14" data-i18n="days_14"></option>
          <option value="30" data-i18n="days_30"></option>
        </select>
      </div>
      <div class="field">
        <label for="set-wakeTarget" data-i18n="wake_target"></label>
        <input id="set-wakeTarget" type="time" data-setting="wakeTarget">
      </div>
    </details>
    <details class="settings-section" data-section="calc">
      <summary data-i18n="section_calc"></summary>
      <div class="field">
        <label for="set-avgDays" data-i18n="avg_days"></label>
        <input id="set-avgDays" type="number" min="3" max="30" data-setting="avgDays">
      </div>
      <div class="field">
        <label for="set-minSleepMin" data-i18n="min_sleep"></label>
        <input id="set-minSleepMin" type="number" min="180" max="720" data-setting="minSleepMin">
      </div>
      <div class="field">
        <label for="set-staleHours" data-i18n="stale_hours"></label>
        <input id="set-staleHours" type="number" min="10" max="36" data-setting="staleHours">
      </div>
    </details>
    <details class="settings-section" data-section="data">
      <summary data-i18n="tab_data"></summary>
      <div class="row">
        <button type="button" class="btn" id="data-export" data-i18n="export_file"></button>
        <button type="button" class="btn" id="data-import" data-i18n="import_file"></button>
        <input id="data-file" type="file" accept="application/json,.json" hidden>
        <button type="button" class="btn danger" id="data-clear" data-i18n="clear_all"></button>
      </div>
      <p class="hint" data-i18n="data_hint"></p>
      <textarea id="data-text" spellcheck="false"></textarea>
      <div class="row">
        <button type="button" class="btn" id="data-copy-text" data-i18n="copy_text"></button>
        <button type="button" class="btn" id="data-import-text" data-i18n="import_text"></button>
      </div>
      <div id="data-message" data-state="none"></div>
    </details>
    <details class="settings-section about" data-section="about">
      <summary data-i18n="tab_about"></summary>
      <p id="about-description" data-i18n="about_description"></p>
      <h3 data-i18n="about_links"></h3>
      <ul>
        <li><a id="about-repo" href="https://github.com/ytx/simplePages" target="_blank" rel="noopener" data-i18n="about_repo"></a></li>
        <li><a id="about-page" href="https://github.com/ytx/simplePages" target="_blank" rel="noopener" data-i18n="about_page"></a></li>
      </ul>
      <h3 data-i18n="about_license"></h3>
      <p id="about-license"><a href="https://github.com/ytx/simplePages/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a> — Copyright (c) 2026 ytx</p>
      <h3 data-i18n="about_credits"></h3>
      <ul id="about-credits"></ul>
    </details>
  </section>
</main>
<footer id="status-bar">
  <span id="clock"></span>
  <span id="status-message"></span>
  <span id="status-dot" data-state="ok"></span>
</footer>
<nav id="tabbar" role="tablist">
  <button class="tab" type="button" role="tab" data-tab="today" aria-selected="true"><svg aria-hidden="true"><use href="#icon-bedtime"></use></svg><span data-i18n="tab_today"></span></button>
  <button class="tab" type="button" role="tab" data-tab="history" aria-selected="false"><svg aria-hidden="true"><use href="#icon-bar-chart"></use></svg><span data-i18n="tab_history"></span></button>
  <button class="tab" type="button" role="tab" data-tab="settings" aria-selected="false"><svg aria-hidden="true"><use href="#icon-settings"></use></svg><span data-i18n="tab_settings"></span></button>
</nav>
<dialog id="dialog">
  <form method="dialog">
    <p id="dialog-message"></p>
    <input id="dialog-input" type="text" autocomplete="off" hidden>
    <div class="dialog-actions">
      <button id="dialog-cancel" class="btn" type="button" data-i18n="cancel"></button>
      <button id="dialog-ok" class="btn" type="submit" value="ok" data-i18n="ok"></button>
    </div>
  </form>
</dialog>
<dialog id="sheet">
  <form method="dialog">
    <h2 id="sheet-title" tabindex="-1"></h2>
    <div id="sheet-body"></div>
    <div class="dialog-actions">

  function summaryLine(r, lang) {

    if (isNap(r)) return `${span} · ${ja ? '仮眠' : 'nap'} ${dur}`;
    return `${span} · ${ja ? '中央' : 'mid'} ${formatHM(midMinutes(r.bedAt, r.wakeAt))} · ${dur}`;

<script id="app-ui">

  const DISPLAY_ONLY_KEYS = new Set(['lang', 'theme', 'zoom', 'chartDays', 'wakeTarget', 'avgDays', 'minSleepMin', 'staleHours']);
  const TABS = ['today', 'history', 'settings'];

  let settings = {};
  let lastMinute = null;
  let idleTimer = null;
  let toolbarAttention = false;
  let storageOk = true;
  let data = null;
  let activeTab = 'today';
  let sheetState = null;
  let sheetValidate = null;
  let lastStatus = null;
  const tr = (key, params) => Logic.t(settings.lang, key, params);

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  const storage = {
    read() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
    },
    write(s) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: Logic.VERSION, settings: s }));
        return true;
      } catch { return false; }
    },
    clear() {
      try { localStorage.removeItem(STORAGE_KEY); } catch { /* ignore */ }
    },
    // 設定を上書きせずに書き込み可否だけ調べる。
    probe() {
      try {
        localStorage.setItem(`${STORAGE_KEY}.probe`, '1');
        localStorage.removeItem(`${STORAGE_KEY}.probe`);
        return true;
      } catch { return false; }
    },
  };

  function persist() {
    storageOk = storage.write(settings);
    showStorageStatus();
  }

  function showStorageStatus() {
    if (storageOk) setStatus('ok', () => tr('status_saved'));
    else setStatus('warn', () => tr('status_storage_unavailable'));
  }

  function loadSettings() {
    const query = Object.fromEntries(new URLSearchParams(location.search));
    const stored = Logic.migrateStored(storage.read(), Logic.VERSION);
    settings = Logic.fixupSettings(Logic.resolveSettings(SCHEMA, stored, query));
    if (query.save === '1') storageOk = storage.write(settings);
  }

  function getSettings() { return { ...settings }; }

  function updateSettings(patch) {
    settings = Logic.fixupSettings(Logic.resolveSettings(SCHEMA, { ...settings, ...patch }, {}));
    persist();
    applySettings();
    renderAll();
  }

  function applyI18n() {
    document.documentElement.lang = settings.lang;
    for (const e of $$('[data-i18n]')) e.textContent = tr(e.dataset.i18n);
    for (const e of $$('[data-i18n-placeholder]')) e.placeholder = tr(e.dataset.i18nPlaceholder);
    for (const e of $$('[data-i18n-label]')) e.setAttribute('aria-label', tr(e.dataset.i18nLabel));
    if (lastStatus) setStatus(lastStatus.state, lastStatus.message);
  }

  function currentTheme() {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    return Logic.effectiveTheme(settings.theme, prefersDark);
  }

  function applyTheme() {
    const theme = currentTheme();
    document.documentElement.dataset.theme = theme;
    // アイコンは「切替先」を表す: ライト表示中は月、ダーク表示中は太陽。
    $('#btn-theme use').setAttribute('href', theme === 'dark' ? '#icon-light-mode' : '#icon-dark-mode');
  }

  function applyZoom(zoom) {
    document.documentElement.style.setProperty('--zoom', String(zoom / 100));
    $('#btn-zoom-in').disabled = Logic.stepZoom(zoom, 1) === zoom;
    $('#btn-zoom-out').disabled = Logic.stepZoom(zoom, -1) === zoom;
  }

  function applySettings() {

    applyTheme();
    applyZoom(settings.zoom);
    for (const e of $$('[data-setting]')) e.value = settings[e.dataset.setting];
    syncDataText();
  }

  // ページ側が true にすると減光せず、設定ボタンを強調する。
  function setToolbarAttention(on) {

    toolbarAttention = !!on;
    $('#btn-settings').classList.toggle('attention', toolbarAttention);

    else resetIdle();
  }

  function bindToolbar() {
    $('#btn-theme').addEventListener('click', () => updateSettings({ theme: Logic.toggleTheme(currentTheme()) }));
    $('#btn-zoom-in').addEventListener('click', () => updateSettings({ zoom: Logic.stepZoom(settings.zoom, 1) }));

  }

  // message は文字列か、現在言語で文字列を返す関数。関数なら言語切替時に再評価する。
  function setStatus(state, message) {

    const e = $('#status-message');
    e.dataset.state = state;
    e.textContent = (typeof message === 'function' ? message() : message) || '';
  }

  function tickClock(noRender = false) {
    const d = new Date();
    const minute = Math.floor(d.getTime() / 60000);
    if (minute !== lastMinute) {
      const first = lastMinute === null;
      lastMinute = minute;
      if (!first && !noRender && data && !$('#sheet').open) {
        if (activeTab === 'today') renderToday();
        else if (activeTab === 'history') renderHistory();
      }
    }
    $('#clock').textContent = new Intl.DateTimeFormat(settings.lang === 'ja' ? 'ja-JP' : 'en-US',
      { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(d);
  }

  // ---- 描画(後続タスクで中身を足す) ----
  // ---- 今日タブ ----
  const pad2 = (n) => String(n).padStart(2, '0');
  const hmOf = (d) => Logic.formatHM(d.getHours() * 60 + d.getMinutes());

  function diffPhrase(midMin, targetMin) {
    const d = Logic.circularDiff(midMin, targetMin);
    if (d < 0) return tr('diff_early', { n: -d });
    if (d > 0) return tr('diff_late', { n: d });
    return tr('diff_on');
  }
  function diffParenT(midMin, targetMin) {
    if (targetMin === null) return '';
    const d = Logic.circularDiff(midMin, targetMin);
    const t = Logic.formatHM(targetMin);
    const p = d < 0 ? tr('diff_early_t', { n: -d, t }) : d > 0 ? tr('diff_late_t', { n: d, t }) : tr('diff_on_t', { t });
    return tr('diff_paren', { d: p });
  }
  const diffParen = (midMin, targetMin) => (targetMin === null ? '' : tr('diff_paren', { d: diffPhrase(midMin, targetMin) }));

  function errText(error) {
    if (error === 'order') return tr('err_order');
    if (error === 'too_long') return tr('err_too_long');
    return tr('err_overlap');
  }

  function adviceCard(title, cls) {
    const c = el('div', 'advice-card' + (cls ? ' ' + cls : ''));
    c.append(el('div', 'advice-title', title));
    return c;
  }

  function flagLine(sleepMin) {
    const sub = el('div', 'advice-sub', tr('sleep_for', { d: Logic.formatDuration(sleepMin, settings.lang) }));
    const f = Logic.adviceFlags(sleepMin, settings);
    if (f) {
      sub.textContent += ' · ';
      sub.append(el('span', 'warn advice-sub', tr(f === 'short' ? 'flag_short' : 'flag_long')));
    }
    return sub;
  }

  function stepWakeTarget(delta) {
    const [h, m] = settings.wakeTarget.split(':').map(Number);
    const v = (((h * 60 + m + delta) % 1440) + 1440) % 1440;
    updateSettings({ wakeTarget: `${pad2(Math.floor(v / 60))}:${pad2(v % 60)}` });
  }

  function lastRecordLine(now, targetMin) {
    const done = Logic.completed(data.records);
    if (done.length === 0) return null;
    const r = done.reduce((a, b) => (b.wakeAt > a.wakeAt ? b : a));
    const params = {
      w: Logic.formatHM(Logic.minutesOfDay(r.wakeAt)),
      m: Logic.formatHM(Logic.midMinutes(r.bedAt, r.wakeAt)),
      diff: diffParen(Logic.midMinutes(r.bedAt, r.wakeAt), targetMin),
      date: Logic.formatDateShort(r.wakeAt, settings.lang),
    };
    const today = r.wakeAt.slice(0, 10) === Logic.todayStr(now);
    return el('div', 'today-last', tr(today ? 'last_today' : 'last_day', params));
  }

  // 日時 1 つを入れるシート。check(value) は Logic.validateRecord の結果か { ok:false, error } を返す。
  function dateTimeSheet({ title, label, initial, max, check, onSave }) {
    let input = null;
    let err = null;
    const validate = () => {
      const v = input.value;
      let msg = '';
      if (!v) msg = tr('err_empty');
      else if (max && v > max) msg = tr('err_future');
      else {
        const res = check(v);
        if (!res.ok) msg = errText(res.error);
      }

      $('#sheet-ok').disabled = msg !== '';
      return msg === '';

      title,
      build(body) {
        body.append(el('div', 'sheet-label', label));

        input.type = 'datetime-local';
        input.step = '60';
        input.value = initial;

        validate();
      },
      validate,
      onOk() { onSave(input.value); },

  }

      saveData();
      renderToday();
    });
  }

  function fixBedTime(rec, now) {

      label: tr('label_bed'),
      initial: rec.bedAt,
      max: Logic.formatLocal(now),
      check: (v) => Logic.validateRecord({ ...rec, bedAt: v }, data.records),
      onSave(v) {

        saveData();
        renderToday();
      },
    });
  }

  function enterWakeTime(rec) {

    dateTimeSheet({
      title: tr('enter_wake_time'),
      label: tr('label_wake'),
      initial,
      max: Logic.formatLocal(new Date()),
      check: (v) => Logic.validateRecord({ ...rec, wakeAt: v }, data.records),
      onSave(v) {
        data = Logic.normalizeData({ ...data, records: data.records.map((r) => (r.id === rec.id ? { ...r, wakeAt: v } : r)) });
        saveData();
        renderToday();
      },
    });
  }

  function wakeNow(rec, now) {

  function sleepNow(now) {

    renderToday();

  function renderToday() {
    if (!data) return;

    const nowM = Logic.truncMin(now);

        const acts = el('div', 'card-actions');

        b1.type = 'button';
        b1.addEventListener('click', () => enterWakeTime(rec));

        b2.type = 'button';
        b2.addEventListener('click', () => cancelSleep(rec));

        c.append(acts);
        nodes.push(c);

        const mid = Logic.midMinutes(rec.bedAt, nowStr);
        footNodes.push(el('div', 'advice-sub', tr('if_wake_now', { m: Logic.formatHM(mid), diff: diffParenT(mid, targetMin) })));
      }

      l1.type = 'button';
      l1.addEventListener('click', () => fixBedTime(rec, new Date()));

      l2.type = 'button';
      l2.addEventListener('click', () => cancelSleep(rec));
      links.append(l1, l2);
      footNodes.push(links);
    }
    body.replaceChildren(...nodes);
    foot.replaceChildren(...footNodes);
  }

  function svg(tag, attrs, text) {
    const n = document.createElementNS($('#history-chart').namespaceURI, tag);
    for (const k of Object.keys(attrs || {})) n.setAttribute(k, String(attrs[k]));
    if (text !== undefined) n.textContent = text;
    return n;
  }

  // 就寝・起床の 2 項目を編集するシート。rec は新規なら未保存の記録。
  function recordSheet(rec, isNew) {
    let bedIn = null;
    let wakeIn = null;
    let err = null;
    const validate = () => {
      const b = bedIn.value;
      const w = wakeIn.value;
      let msg = '';
      if (!b || !w) msg = tr('err_empty');
      else if (w > Logic.formatLocal(new Date())) msg = tr('err_future');
      else {
        const res = Logic.validateRecord({ ...rec, bedAt: b, wakeAt: w }, data.records);
        if (!res.ok) msg = errText(res.error);
      }
      err.textContent = msg;
      $('#sheet-ok').disabled = msg !== '';
      return msg === '';
    };
    openSheet({
      title: tr(isNew ? 'add_record' : 'edit_record').replace(/^\+ /, ''),
      build(body) {
        const mk = (labelKey, value) => {
          body.append(el('div', 'sheet-label', tr(labelKey)));
          const i = el('input');
          i.type = 'datetime-local';
          i.step = '60';
          i.value = value || '';
          i.addEventListener('input', validate);
          body.append(i);
          return i;
        };
        bedIn = mk('edit_bed', rec.bedAt);
        wakeIn = mk('edit_wake', rec.wakeAt);
        err = el('div', 'sheet-error');
        body.append(err);
        validate();
      },
      validate,
      onOk() {
        const next = { ...rec, bedAt: bedIn.value, wakeAt: wakeIn.value };
        const exists = data.records.some((r) => r.id === rec.id);
        const records = exists ? data.records.map((r) => (r.id === rec.id ? next : r)) : [...data.records, next];
        data = Logic.normalizeData({ ...data, records });
        saveData();
        renderAll();
      },
      onDelete: isNew ? undefined : async () => {
        const res = await dialog({ message: tr('confirm_delete_record'), danger: true });
        if (!res.ok) return false;
        data = Logic.normalizeData({ ...data, records: data.records.filter((r) => r.id !== rec.id) });
        saveData();
        renderAll();
        return true;
      },
    });
  }

  function addRecord() {
    const now = new Date();
    const d = (n) => new Date(now.getFullYear(), now.getMonth(), now.getDate() + n);
    const at = (base, h) => Logic.formatLocal(new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, 0));
    recordSheet({ id: Logic.newId(now), bedAt: at(d(-1), 23), wakeAt: at(d(0), 6), createdAt: now.toISOString() }, true);
  }

  function drawChart(model) {
    const W = 360, H = 240, L = 36, B = 20, T = 6, R = 4;
    const plotH = H - B - T;
    const colW = (W - L - R) / model.cols.length;
    const Y = (v) => T + v * plotH;
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const nodes = [];
    for (const t of model.yTicks) {
      nodes.push(svg('line', { x1: L, x2: W - R, y1: Y(t.y), y2: Y(t.y), stroke: 'var(--border)', 'stroke-width': 1 }));
      nodes.push(svg('text', { x: L - 4, y: Y(t.y) + 3, 'text-anchor': 'end' }, t.label));
    }
    if (model.target && model.target.y >= 0 && model.target.y <= 1) {
      const bandH = (60 / ((model.yMax - model.yMin))) * plotH;
      nodes.push(svg('rect', { x: L, y: Y(model.target.y) - bandH / 2, width: W - L - R, height: bandH, fill: 'var(--accent)', opacity: 0.12 }));
      nodes.push(svg('line', { x1: L, x2: W - R, y1: Y(model.target.y), y2: Y(model.target.y), stroke: 'var(--accent)', 'stroke-width': 1, 'stroke-dasharray': '4 3' }));
    }
    for (const c of model.cols) {
      if (c.label) nodes.push(svg('text', { x: L + (c.x + 0.5) * colW, y: H - 6, 'text-anchor': 'middle' }, c.label));
    }
    for (const b of model.bars) {
      if (b.x < 0) continue;
      const y0 = clamp(b.yBed), y1 = clamp(b.yWake);
      if (y1 - y0 <= 0) continue;
      const w = b.nap ? colW / 3 : Math.max(2, colW - 6);
      const cx = L + (b.x + 0.5) * colW;
      nodes.push(svg('rect', { x: cx - w / 2, y: Y(y0), width: w, height: (y1 - y0) * plotH, rx: 3, fill: 'var(--accent)', opacity: 0.35 }));
      if (!b.nap) nodes.push(svg('circle', { cx, cy: Y(clamp(b.yMid)), r: 3.5, fill: 'var(--error)' }));
    }
    if (model.line.length > 1) {
      const pts = model.line.map((p) => `${L + (p.x + 0.5) * colW},${Y(clamp(p.y))}`).join(' ');
      nodes.push(svg('polyline', { points: pts, fill: 'none', stroke: 'var(--error)', 'stroke-width': 1.5 }));
    }
    $('#history-chart').replaceChildren(...nodes);
  }

  function renderHistory() {
    if (!data) return;
    const today = Logic.todayStr(new Date());
    const days = settings.chartDays;
    const lang = settings.lang;
    for (const b of $$('#chart-days .seg')) b.setAttribute('aria-pressed', String(Number(b.dataset.days) === days));
    const avg = Logic.stats(data.records, settings.avgDays, today);
    const cur = Logic.stats(data.records, days, today);
    $('#history-stats').textContent = avg.targetMin === null
      ? tr('not_enough')
      : tr('history_stats', { t: Logic.formatHM(avg.targetMin), d: settings.avgDays, sd: cur.sdMin === null ? '-' : cur.sdMin, s: cur.avgSleepMin === null ? '-' : Logic.formatDuration(cur.avgSleepMin, lang) });
    const chart = $('#history-chart');
    chart.setAttribute('aria-label', tr('chart_label'));
    drawChart(Logic.chartModel(data.records, days, today, avg.targetMin, lang));
    const rows = Logic.completed(data.records).filter((r) => Logic.inWindow(r, days, today))
      .sort((a, b) => (a.wakeAt < b.wakeAt ? 1 : a.wakeAt > b.wakeAt ? -1 : 0));
    $('#history-add').textContent = tr('add_record');
    if (rows.length === 0) {
      $('#history-list').replaceChildren(el('li', 'history-empty', tr(Logic.completed(data.records).length > 0 ? 'no_records_in_range' : 'no_records')));
      return;
    }
    $('#history-list').replaceChildren(...rows.map((r) => {
      const li = el('li');
      const b = el('button', 'history-item');
      b.type = 'button';
      b.append(el('div', 'history-date', Logic.formatDateShort(Logic.wakeDate(r), lang)), el('div', 'history-sum', Logic.summaryLine(r, lang)));
      b.addEventListener('click', () => recordSheet(r, false));
      li.append(b);
      return li;
    }));
  }

  function bindHistory() {
    for (const b of $$('#chart-days .seg')) {
      b.addEventListener('click', () => { updateSettings({ chartDays: Number(b.dataset.days) }); });
    }
    $('#history-add').addEventListener('click', addRecord);
  }

  function renderAll() {
    renderToday();
    renderHistory();
  }

  function onVisibility() {
    if (document.visibilityState === 'visible') { tickClock(true); renderAll(); }
  }

  function resetIdle() {
    $('#toolbar').classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (!toolbarAttention) $('#toolbar').classList.add('idle'); }, IDLE_MS);
  }

  // ---- タブ ----
  function switchTab(name) {
    if (!TABS.includes(name)) return;
    activeTab = name;
    for (const b of $$('#tabbar .tab')) b.setAttribute('aria-selected', String(b.dataset.tab === name));
    for (const p of $$('.tab-pane')) p.classList.toggle('active', p.id === `tab-${name}`);
    if (name === 'settings') refreshDataText();
    renderAll();
  }

  function bindTabs() {
    for (const b of $$('#tabbar .tab')) b.addEventListener('click', () => switchTab(b.dataset.tab));
  }

  // ---- 小ダイアログ(confirm / prompt の代わり) ----
  // opts: { message, input?: { type, value, min, max }, okLabel?, danger? } → { ok, value }
  function dialog({ message, input = null, okLabel = '', danger = false }) {
    return new Promise((resolve) => {
      const dlg = $('#dialog');
      const inp = $('#dialog-input');
      const okBtn = $('#dialog-ok');
      $('#dialog-message').textContent = message;
      inp.hidden = input === null;
      if (input) {
        inp.type = input.type || 'text';
        inp.value = input.value ?? '';
        for (const k of ['min', 'max']) { if (input[k] !== undefined) inp.setAttribute(k, String(input[k])); else inp.removeAttribute(k); }
      } else inp.value = '';
      okBtn.textContent = okLabel || tr('ok');
      okBtn.classList.toggle('danger', !!danger);
      const onClose = () => {
        dlg.removeEventListener('close', onClose);
        const ok = dlg.returnValue === 'ok';
        resolve({ ok, value: ok && input ? inp.value : null });
      };
      dlg.addEventListener('close', onClose);
      dlg.returnValue = '';
      dlg.showModal();
      if (input) { inp.focus(); inp.select(); }
    });
  }

  // シート: build(body) が空にした #sheet-body へ要素を足す。onOk は保存で閉じたとき、
  // onDelete は削除ボタン(true を返すと閉じる)。
  function openSheet({ title, build, onOk, onDelete, validate = null, okLabel = 'save' }) {
    const dlg = $('#sheet');
    const body = $('#sheet-body');
    $('#sheet-title').textContent = title;
    $('#sheet-ok').textContent = tr(okLabel);
    body.replaceChildren();
    $('#sheet-ok').disabled = false;
    sheetValidate = validate;
    build(body);
    const del = $('#sheet-delete');
    del.hidden = !onDelete;
    sheetState = { onOk, onDelete };
    dlg.returnValue = '';
    dlg.showModal();
    // showModal は最初の入力欄にフォーカスする。日付欄だと iOS でカレンダーが即座に開くので、見出しへ移す。
    if (document.activeElement && ['date', 'datetime-local', 'time'].includes(document.activeElement.type)) $('#sheet-title').focus();
  }

  function bindDialogs() {
    $('#btn-sleep').addEventListener('click', () => sleepNow(new Date()));
    $('#btn-wake').addEventListener('click', () => { const r = Logic.sleepingRecord(data.records); if (r) wakeNow(r, new Date()); });
    $('#dialog-cancel').addEventListener('click', () => $('#dialog').close('cancel'));
    $('#sheet-cancel').addEventListener('click', () => $('#sheet').close('cancel'));
    $('#sheet-ok').addEventListener('click', (ev) => {
      if (sheetValidate && !sheetValidate()) ev.preventDefault();
    });
    $('#sheet').addEventListener('close', () => {
      const st = sheetState;
      sheetState = null;
      if (st && $('#sheet').returnValue === 'ok' && st.onOk) st.onOk();
    });
    $('#sheet-delete').addEventListener('click', async () => {
      const st = sheetState;
      if (!st || !st.onDelete) return;
      if (await st.onDelete()) { sheetState = null; $('#sheet').close('cancel'); }
    });
  }

  // ---- データストア ----
  function loadData() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(DATA_KEY)); } catch { raw = null; }
    data = Logic.normalizeData(raw);
    return Logic.invalidCount(raw);
  }

  function saveData() {
    try {
      localStorage.setItem(DATA_KEY, JSON.stringify({ ...data, version: Logic.DATA_VERSION }));
      storageOk = true;
    } catch { storageOk = false; }
    showStorageStatus();
  }

  function getData() { return structuredClone(data); }

  function setData(next) {
    data = Logic.normalizeData(next);
    saveData();
    renderAll();
    syncDataText();
  }

  // ---- クリップボード ----
  async function copyText(text, area) {
    try {
      let timer;
      const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 1500); });
      try { await Promise.race([navigator.clipboard.writeText(text), timeout]); } finally { clearTimeout(timer); }
      return true;
    } catch { /* フォールバックへ */ }
    let tmp = null;
    try {
      let ta = area;
      if (!ta) {
        tmp = document.createElement('textarea');
        tmp.value = text;
        tmp.style.position = 'fixed';
        tmp.style.opacity = '0';
        document.body.append(tmp);
        ta = tmp;
      }
      ta.focus();
      ta.select();
      return !!document.execCommand('copy');
    } catch {
      return false;
    } finally {
      if (tmp) tmp.remove();
    }
  }

  // ---- 設定タブ ----
  function refreshDataText() {
    $('#data-text').value = exportAll();
    setDataMessage('none', '');
  }

  function exportAll() {
    return JSON.stringify({ version: Logic.VERSION, settings, data: { version: Logic.DATA_VERSION, ...data } }, null, 2);
  }

  // 設定タブ表示中は、設定・データの変更に追従して #data-text を更新する(メッセージは残す)。
  function syncDataText() {
    if (activeTab === 'settings' && data) $('#data-text').value = exportAll();
  }

  function setDataMessage(state, text) {
    const e = $('#data-message');
    e.dataset.state = state;
    e.textContent = text;
  }

  async function importText(text) {
    const result = Logic.parseImportAll(text, Logic.VERSION, Logic.DATA_VERSION);
    if (!result.ok) {
      setDataMessage('error', tr(result.reason === 'invalid_json' ? 'import_failed_json' : 'import_failed_format'));
      return;
    }
    if (!(await dialog({ message: tr('confirm_import_replace'), danger: true })).ok) return;
    if (result.settings) replaceSettings(result.settings);
    if (result.data) setData(result.data);
    refreshDataText();
    setDataMessage('ok', tr('import_ok') + (result.skipped > 0 ? ' / ' + tr('import_skipped', { n: result.skipped }) : ''));
  }

  // 置き換え: 現在の設定に重ねず、既定値に取り込み分だけを適用する。
  function replaceSettings(next) {
    settings = Logic.fixupSettings(Logic.resolveSettings(SCHEMA, next, {}));
    persist();
    applySettings();
    renderAll();
  }

  function renderAbout() {
    $('#about-page').href = `${REPO_URL}/tree/main/${ABOUT.page}`;
    const list = $('#about-credits');
    list.replaceChildren();
    for (const key of ABOUT.credits) {
      const li = el('li');
      li.dataset.i18n = key;
      list.appendChild(li);
    }
  }

  function bindSettings() {
    for (const e of $$('[data-setting]')) {
      e.addEventListener('change', () => updateSettings({ [e.dataset.setting]: e.value }));
    }
    $('#data-export').addEventListener('click', () => {
      const blob = new Blob([exportAll()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const d = new Date();
      const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      a.download = `${PAGE}-${ymd}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    $('#data-import').addEventListener('click', () => $('#data-file').click());
    $('#data-file').addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      if (file) importText(await file.text());
      ev.target.value = '';
    });
    $('#data-import-text').addEventListener('click', () => importText($('#data-text').value));
    $('#data-copy-text').addEventListener('click', async () => {
      const ta = $('#data-text');
      const ok = await copyText(ta.value, ta);
      setDataMessage(ok ? 'ok' : 'error', tr(ok ? 'copied' : 'copy_failed_short'));
    });
    $('#data-clear').addEventListener('click', async () => {
      if (!(await dialog({ message: tr('confirm_clear') })).ok) return;
      storage.clear();
      try { localStorage.removeItem(DATA_KEY); } catch { /* ignore */ }
      location.href = location.pathname;
    });
    renderAbout();
  }

  function init() {
    loadSettings();
    bindSettings();
    bindToolbar();
    bindTabs();
    bindHistory();
    bindDialogs();
    const skippedOnLoad = loadData();
    applySettings();
    // 起動時に書き込めるか確かめて、状態ドットに反映する(設定は書かない)。
    storageOk = storage.probe();
    showStorageStatus();
    if (skippedOnLoad > 0) setStatus('warn', () => tr('import_skipped', { n: skippedOnLoad }));
    const initialTab = new URLSearchParams(location.search).get('tab');
    switchTab(TABS.includes(initialTab) ? initialTab : 'today');
    renderAll();
    tickClock();
    setInterval(tickClock, 1000);
    document.addEventListener('visibilitychange', onVisibility);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    for (const ev of ['pointermove', 'pointerdown', 'touchstart', 'keydown']) document.addEventListener(ev, resetIdle, { passive: true });
    resetIdle();
  }

  document.addEventListener('DOMContentLoaded', init);

  return { SCHEMA, $, el, tr, getSettings, updateSettings, setStatus, applyZoom, setToolbarAttention, switchTab, dialog, openSheet, getData, setData, loadData, saveData, exportAll, importText, setDataMessage, copyText };
})();
</script>
</body>
</html>
