<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>l_timer</title>
<style>
:root {
  --bg: #f6f7f9;
  --bg-panel: #ffffff;
  --fg: #1c1f26;
  --fg-muted: #5c6370;
  --border: #d9dde3;
  --accent: #2b7de9;
  --ok: #2fa84f;
  --busy: #e6a700;
  --error: #d64545;
  --zoom: 1;
  --radius: 10px;
  --gap: calc(clamp(8px, 1vw, 16px) * var(--zoom));
  --fs-base: calc(clamp(14px, 1.2vw, 20px) * var(--zoom));
  --fs-small: calc(var(--fs-base) * 0.8);
  --fs-large: calc(var(--fs-base) * 1.6);
  --fs-timer: calc(clamp(64px, min(14vw, 20vh), 180px) * var(--zoom));
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
html[data-theme="dark"] {
  --bg: #12151b;
  --bg-panel: #1b1f27;
  --fg: #e7eaf0;
  --fg-muted: #9aa3b2;
  --border: #2d333f;
  --accent: #5b9cf5;
}
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --bg: #12151b; --bg-panel: #1b1f27; --fg: #e7eaf0; --fg-muted: #9aa3b2; --border: #2d333f; --accent: #5b9cf5;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--fs-base);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#toolbar {
  display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--gap) / 2);
  padding: calc(var(--gap) / 2) var(--gap);
  transition: opacity 0.6s;
}
#toolbar.idle { opacity: 0.15; }
.icon-btn {
  width: 2.2em; height: 2.2em; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-panel); color: var(--fg);
  cursor: pointer; display: grid; place-items: center; padding: 0; font: inherit;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 1.3em; height: 1.3em; fill: currentColor; }
.icon-btn.attention { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
#content { flex: 1; min-height: 0; padding: 0 var(--gap) var(--gap); }
#page-title { margin: 0 0 var(--gap); text-align: center; font-size: var(--fs-large); font-weight: 600; }
#status-bar {
  display: flex; justify-content: center; align-items: center; gap: var(--gap);
  padding: calc(var(--gap) / 2) var(--gap);
  border-top: 1px solid var(--border);
  font-size: var(--fs-small); color: var(--fg-muted);
}
#status-dot {
  width: 0.7em; height: 0.7em; border-radius: 50%;
  background: var(--fg-muted);
}
#status-dot[data-state="ok"] { background: var(--ok); }
#status-dot[data-state="busy"] { background: var(--busy); }
#status-dot[data-state="error"] { background: var(--error); }
#status-message[data-state="error"] { color: var(--error); }
dialog#settings {
  background: var(--bg-panel); color: var(--fg);
  border: 1px solid var(--border); border-radius: var(--radius);
  width: min(90vw, 36em); height: min(85vh, 32em); padding: 0;
  display: none; grid-template-rows: auto auto 1fr; overflow: hidden;
}
dialog#settings[open] { display: grid; }
dialog#settings::backdrop { background: rgba(0,0,0,0.5); }
.dlg-header { display: flex; align-items: center; padding: calc(var(--gap) / 2) var(--gap); border-bottom: 1px solid var(--border); }
.dlg-header h2 { margin: 0; font-size: var(--fs-base); flex: 1; }
.tabs { display: flex; gap: 2px; padding: 0 var(--gap); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button {
  background: none; border: none; color: var(--fg-muted); padding: 0.6em 1em;
  cursor: pointer; border-bottom: 2px solid transparent; font: inherit; white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab-body { overflow: auto; min-height: 0; }
.tab-panel { display: none; padding: var(--gap); }
.tab-panel.active { display: block; }
.field { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); align-items: center; margin-bottom: var(--gap); }
.field label { color: var(--fg-muted); }
select, input, textarea, button.btn {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.4em 0.6em;
}
textarea#data-text { width: 100%; min-height: 10em; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: var(--fs-small); resize: vertical; }
button.btn { cursor: pointer; }
button.btn.danger { color: var(--error); }
.row { display: flex; gap: var(--gap); flex-wrap: wrap; }
.hint { color: var(--fg-muted); font-size: var(--fs-small); margin: calc(var(--gap) / 2) 0; }
#data-message { min-height: 1.4em; margin-top: calc(var(--gap) / 2); }
#data-message[data-state="error"] { color: var(--error); }
.about h3 { margin: var(--gap) 0 calc(var(--gap) / 3); font-size: var(--fs-base); }
.about ul { margin: 0; padding-left: 1.2em; }
.about a { color: var(--accent); }
/* l_timer: 左タイマー、右エディタ。700px 未満は縦積み */
:root {
  --c-lecture: #1565c0;
  --c-break: #2e7d32;
  --c-overtime: #d64545;
  --c-exercise: #e67e22;
  --fs-timer: calc(clamp(48px, min(16cqw, 20vh), 180px) * var(--zoom));
  --fs-timer-small: calc(var(--fs-timer) * 0.5);
  --left-width: 50%;
  --editor-zoom: 1;
}
html[data-theme="dark"] { --c-lecture: #5b9cf5; --c-break: #4caf50; --c-overtime: #f06060; --c-exercise: #f39c12; }
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) { --c-lecture: #5b9cf5; --c-break: #4caf50; --c-overtime: #f06060; --c-exercise: #f39c12; }
}
#content { display: grid; grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; column-gap: 0; }
#content.editor-on { grid-template-columns: var(--left-width) 8px minmax(0, 1fr); }
#page-title { grid-column: 1 / -1; }
#page-title.lecture { color: var(--c-lecture); }
#page-title.break { color: var(--c-break); }
#page-title.overtime { color: var(--c-overtime); }
#page-title.warning { color: var(--c-exercise); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { #page-title.warning { animation: none; } }
#timer-pane { container-type: inline-size; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap); min-width: 0; min-height: 0; overflow: auto; padding: 0 var(--gap); }
#main-remaining { font-size: var(--fs-timer); font-variant-numeric: tabular-nums; line-height: 1; font-weight: 700; color: var(--c-lecture); transition: font-size 0.3s, opacity 0.3s; }
#main-remaining.break { color: var(--c-break); }
#main-remaining.overtime { color: var(--c-overtime); }
#timer-pane.exercise-active #main-remaining { font-size: var(--fs-timer-small); opacity: 0.45; }
.progress { width: 7ch; max-width: 100%; font-size: var(--fs-timer); line-height: 0; }
#timer-pane.exercise-active #main-progress { font-size: var(--fs-timer-small); }
.progress-bar { width: 100%; height: clamp(8px, 0.12em, 20px); border-radius: 10px; background: var(--border); overflow: hidden; }
.progress-fill { height: 100%; width: 0%; border-radius: 10px; background: var(--c-lecture); transition: width 0.3s; }
#main-remaining.break ~ .progress .progress-fill, .progress-fill.break { background: var(--c-break); }
.progress-fill.overtime { background: var(--c-overtime); }
.progress-fill.exercise { background: var(--c-exercise); }
.end-row { display: flex; align-items: center; justify-content: center; gap: var(--gap); flex-wrap: wrap; min-height: 2.6em; font-size: var(--fs-large); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.end-row .adj { display: flex; gap: calc(var(--gap) / 2); }
.end-row .adj[hidden] { display: none; }
.tbtn {
  min-height: calc(40px * var(--zoom)); min-width: calc(48px * var(--zoom)); padding: 0 0.8em;
  font: inherit; font-size: var(--fs-base); font-variant-numeric: tabular-nums;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-panel); color: var(--fg); cursor: pointer;
}
.tbtn.small { min-height: calc(32px * var(--zoom)); min-width: calc(40px * var(--zoom)); font-size: var(--fs-small); padding: 0 0.5em; }
.row { display: flex; gap: var(--gap); flex-wrap: wrap; }
.row.controls { justify-content: center; }
.cbtn {
  width: calc(60px * var(--zoom)); height: calc(60px * var(--zoom)); border-radius: 50%;
  border: 2px solid var(--border); background: var(--bg-panel); color: var(--fg); cursor: pointer; display: grid; place-items: center; padding: 0;
}
.cbtn svg { width: 55%; height: 55%; fill: currentColor; }
.cbtn[hidden] { display: none; }
.cbtn.lecture { color: var(--c-lecture); border-color: var(--c-lecture); }
.cbtn.break { color: var(--c-break); border-color: var(--c-break); }
.cbtn.stop { color: var(--c-overtime); border-color: var(--c-overtime); }
.cbtn.exercise { color: var(--c-exercise); border-color: var(--c-exercise); }
.cbtn:hover { background: currentColor; }
.cbtn:hover svg { fill: var(--bg-panel); }
#exercise-area { width: 100%; max-width: 100%; border-bottom: 2px solid var(--border); padding-bottom: var(--gap); text-align: center; }
#exercise-area[hidden] { display: none; }
#exercise-area.paused { opacity: 0.6; }
#exercise-setup, #exercise-running { display: flex; flex-direction: column; align-items: center; gap: calc(var(--gap) / 2); }
#exercise-setup[hidden], #exercise-running[hidden] { display: none; }
.ex-title-row { display: flex; align-items: center; gap: calc(var(--gap) / 2); justify-content: center; width: 100%; max-width: 30em; }
.ex-title-row input { flex: 1; min-width: 0; border-color: var(--c-exercise); }
.ex-time { font-size: var(--fs-timer); font-variant-numeric: tabular-nums; line-height: 1; font-weight: 700; color: var(--c-exercise); }
.ex-time.overtime { color: var(--c-overtime); }
.ex-main { display: flex; align-items: flex-start; justify-content: center; gap: var(--gap); width: 100%; }
.ex-current { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--gap) / 2); }
#ex-title { font-size: var(--fs-large); font-weight: 600; color: var(--c-exercise); }
#ex-paused { font-size: var(--fs-small); color: var(--fg-muted); margin-left: 0.5em; }
#ex-paused[hidden] { display: none; }
.ex-bottom { display: flex; align-items: center; justify-content: center; gap: var(--gap); flex-wrap: wrap; }
.cbtn.ex-stop { width: calc(40px * var(--zoom)); height: calc(40px * var(--zoom)); }
#ex-next-open[hidden], #ex-next-panel[hidden] { display: none; }
#ex-next-panel { display: flex; flex-direction: column; align-items: center; gap: calc(var(--gap) / 2); padding: var(--gap); border: 1px dashed var(--c-exercise); border-radius: var(--radius); }
.ex-next-head { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: calc(var(--gap) / 2); color: var(--fg-muted); font-size: var(--fs-small); }
#ex-next-time { font-size: calc(var(--fs-large) * 1.4); font-weight: 700; color: var(--c-exercise); font-variant-numeric: tabular-nums; }
#resizer { cursor: col-resize; background: var(--border); display: grid; place-items: center; touch-action: none; user-select: none; }
#resizer:hover, #resizer.active { background: var(--accent); }
#resizer[hidden] { display: none; }
#resizer::after { content: ''; width: 2px; height: 40px; background: var(--bg-panel); border-radius: 2px; }
#editor-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0 0 0 var(--gap); gap: calc(var(--gap) / 2); }
#editor-pane[hidden] { display: none; }
.editor-tools { display: flex; align-items: center; gap: calc(var(--gap) / 2); flex-wrap: wrap; }
.editor-tools .spacer { flex: 1; }
.editor-tools .tbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
#ed-zoom-level { min-width: 3.5em; text-align: center; font-variant-numeric: tabular-nums; color: var(--fg-muted); }
#editor {
  flex: 1; min-height: 0; overflow: auto; padding: var(--gap); border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-panel);
  font-size: calc(var(--fs-base) * var(--editor-zoom)); line-height: 1.6; outline: none; overflow-wrap: anywhere;
}
#editor p, #editor h2, #editor ul { margin: 0 0 0.4em; }
#editor h2 { font-size: 1.4em; }
#editor ul { padding-left: 1.4em; }
#editor:empty::before { content: attr(data-placeholder); color: var(--fg-muted); }
.editor-docs { display: flex; align-items: center; gap: calc(var(--gap) / 2); }
.editor-docs select { flex: 1; min-width: 0; }
.editor-docs .icon-btn.saved { background: var(--ok); border-color: var(--ok); color: #fff; }
dialog#dialog {
  background: var(--bg-panel); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius);
  width: min(90vw, 24em); padding: var(--gap); display: none;
}
dialog#dialog[open] { display: block; }
dialog#dialog::backdrop { background: rgba(0,0,0,0.5); }
#dialog-message { margin: 0 0 var(--gap); white-space: pre-wrap; }
#dialog-input { width: 100%; margin-bottom: var(--gap); }
#dialog-input[hidden] { display: none; }
.dialog-actions { display: flex; justify-content: flex-end; gap: calc(var(--gap) / 2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--gap) / 2) var(--gap); }
.grid2 .field { grid-template-columns: 1fr 5em; margin-bottom: 0; }
#set-volume { width: 10em; vertical-align: middle; }
#volume-value { display: inline-block; min-width: 3em; text-align: right; }
@media (max-width: 699px) {
  #content.editor-on { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); }
  #resizer { display: none !important; }
  #editor-pane { padding: var(--gap) 0 0; }
  .cbtn { width: 48px; height: 48px; }
  .grid2 { grid-template-columns: 1fr; }
}
</style>
</head>

<script id="app-logic">
const Logic = (() => {
  const VERSION = 1;
  // version n の settings を n+1 へ変換する関数を MIGRATIONS[n] に置く。
  const MIGRATIONS = {};
  const DATA_VERSION = 1;
  // 音声ファイル。src に入れるパスはこの表の値だけ(設定値や URL の文字列を直接 src に渡さない)。
  const SOUND_FILES = {
    'sound1-1': 'audio/sound1-1.wav', 'sound1-2': 'audio/sound1-2.wav', 'sound1-3': 'audio/sound1-3.wav',
    'sound2-1': 'audio/sound2-1.wav', 'sound2-2': 'audio/sound2-2.wav', 'sound2-3': 'audio/sound2-3.wav',
    'sound3-1': 'audio/sound3-1.wav', 'sound3-2': 'audio/sound3-2.wav', 'sound3-3': 'audio/sound3-3.wav',
  };
  // sound1 = 予鈴、sound2 = 終了、sound3 = 超過中の経過音
  const SOUND_GROUPS = {
    sound1: ['sound1-1', 'sound1-2', 'sound1-3'],
    sound2: ['sound2-1', 'sound2-2', 'sound2-3'],
    sound3: ['sound3-1', 'sound3-2', 'sound3-3'],
  };
  const EDITOR_ZOOM_LEVELS = [75, 100, 150, 200, 300, 400];
  const pad2 = (n) => String(n).padStart(2, '0');
  const WEEKDAYS_JA = ['日', '月', '火', '水', '木', '金', '土'];

  // ステータス帯: 日付 + 曜日 + 現在時刻
  function formatDateTimeLine(d, lang) {
    const time = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    if (lang === 'ja') return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} (${WEEKDAYS_JA[d.getDay()]}) ${time}`;
    return `${new Intl.DateTimeFormat('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }).format(d)} ${time}`;
  }

  function coerce(spec, value) {
    if (value === undefined || value === null) return undefined;
    switch (spec.type) {
      case 'int': {
        const n = typeof value === 'number' ? value : Number.parseInt(String(value), 10);
        if (!Number.isInteger(n)) return undefined;
        if (spec.min !== undefined && n < spec.min) return undefined;
        if (spec.max !== undefined && n > spec.max) return undefined;
        return n;
      }
      case 'enum': {
        const v = typeof spec.values[0] === 'number' ? Number(value) : String(value);
        return spec.values.includes(v) ? v : undefined;
      }
      case 'bool': {
        if (typeof value === 'boolean') return value;
        if (value === '1' || value === 'true') return true;
        if (value === '0' || value === 'false') return false;
        return undefined;
      }
      case 'string':
        return String(value);
      case 'object':
        return typeof value === 'object' ? value : undefined;
      default:
        return undefined;
    }
  }

  function resolveSettings(schema, stored, query) {
    const out = {};
    for (const [key, spec] of Object.entries(schema)) {
      let v = coerce(spec, stored && stored[key]);
      if (spec.type !== 'object' && query && query[key] !== undefined) {
        const q = coerce(spec, query[key]);
        if (q !== undefined) v = q;
      }
      out[key] = v === undefined ? spec.default : v;
    }
    return out;
  }

  function migrateStored(raw, version) {
    if (!raw || typeof raw !== 'object' || typeof raw.settings !== 'object' || raw.settings === null || Array.isArray(raw.settings)) return {};
    if (!Number.isInteger(raw.version)) return {};
    let settings = raw.settings;
    for (let v = raw.version; v < version; v++) {
      const m = MIGRATIONS[v];
      if (!m) return {};
      settings = m(settings);
    }
    return settings;
  }

  const I18N = {
    ja: {
      settings: '設定', tab_display: '表示', tab_timer: 'タイマー', tab_sound: '音', tab_data: 'データ', tab_about: 'About',
      language: '言語', theme: 'テーマ', theme_auto: '自動', theme_light: 'ライト', theme_dark: 'ダーク',
      clear_all: 'すべて消去', zoom_in: '拡大', zoom_out: '縮小', fullscreen: 'フルスクリーン', exit_fullscreen: 'フルスクリーン解除',
      toggle_theme: 'ダーク/ライト切替', toggle_lang: '日本語/English', close: '閉じる', ok: 'OK', cancel: 'キャンセル',
      export_file: 'ファイルに書き出す', import_file: 'ファイルから読み込む', import_text: 'テキストから読み込む',
      data_hint: '現在の設定と文書(JSON)。編集して「テキストから読み込む」で反映できます。旧 l_timer の書き出しファイルも読み込めます。',
      import_ok: '読み込みました', import_failed_json: '読み込み失敗: JSON として解釈できません', import_failed_format: '読み込み失敗: 設定ファイルの形式ではありません',
      confirm_clear: '保存した設定・文書・履歴をすべて消去します。よろしいですか?',
      about_links: 'リンク', about_repo: 'GitHub リポジトリ', about_page: 'このページのソース', about_license: 'ライセンス', about_credits: 'クレジット',
      credit_icons: 'アイコン: Material Icons (Google) — Apache License 2.0',

      language: 'Language', theme: 'Theme', theme_auto: 'Auto', theme_light: 'Light', theme_dark: 'Dark',
      clear_all: 'Clear all', zoom_in: 'Zoom in', zoom_out: 'Zoom out', fullscreen: 'Fullscreen', exit_fullscreen: 'Exit fullscreen',
      toggle_theme: 'Toggle dark/light', toggle_lang: '日本語/English', close: 'Close', ok: 'OK', cancel: 'Cancel',
      export_file: 'Export to file', import_file: 'Import from file', import_text: 'Import from text',

      about_links: 'Links', about_repo: 'GitHub repository', about_page: 'Source of this page', about_license: 'License', about_credits: 'Credits',
      credit_icons: 'Icons: Material Icons (Google) — Apache License 2.0',
      about_description: 'A lecture timer. Alternate lecture and break with a warning bell, an end sound and overtime ticks. Run an exercise timer on top of the lecture and keep notes in the side editor.',
      title_idle: 'Lecture Preparation', title_lecture: 'Lecture', title_overtime: 'Lecture Overtime', title_break: 'Break',

      exercise_title_placeholder: 'Exercise title', exercise_start: 'Start', exercise_cancel: 'Cancel', exercise_stop: 'Stop exercise', exercise_paused: 'Paused',

      doc_new: 'New document', doc_save: 'Save', doc_delete: 'Delete', doc_title_prompt: 'Document title',
      doc_unsaved_confirm: 'Unsaved changes will be lost. Continue?', doc_delete_confirm: 'Delete "{title}"? This cannot be undone.',
      untitled: 'Untitled - {date}',
      lecture_min: 'Lecture (min)', break1_min: 'Break (min)', break2_min: 'Lunch break (min)', warning_min: 'Warning (min before end)', tick_sec: 'Overtime tick (sec)',
      exercise_min: 'Exercise (min)', next_exercise_min: 'Next exercise (min)',
      volume: 'Volume', muted: 'Muted', sound1: 'Warning sound', sound2: 'End sound', sound3: 'Overtime sound',
      sound1_1: 'Bell', sound1_2: 'High tone', sound1_3: 'Chord', sound2_1: 'Long tone', sound2_2: 'Double beep', sound2_3: 'Descending tone', sound3_1: 'Beep', sound3_2: 'Click', sound3_3: 'Chime',
      preview: 'Preview', preview_stop: 'Stop preview',

      error_audio: 'Cannot load a sound (using a beep instead)', error_storage: 'Cannot save documents (browser storage unavailable)',
    },
  };

  function t(lang, key, params) {
    const dict = I18N[lang] || I18N.ja;
    let s = dict[key] ?? I18N.ja[key] ?? key;
    if (params) {
      for (const [k, v] of Object.entries(params)) s = s.replaceAll(`{${k}}`, () => String(v));
    }
    return s;
  }

  function detectLang(navigatorLanguage) {
    return typeof navigatorLanguage === 'string' && navigatorLanguage.toLowerCase().startsWith('ja') ? 'ja' : 'en';
  }

  function effectiveTheme(setting, prefersDark) {
    if (setting === 'light' || setting === 'dark') return setting;
    return prefersDark ? 'dark' : 'light';
  }

  const ZOOM_MIN = 50;
  const ZOOM_MAX = 200;
  const ZOOM_STEP = 10;

  function stepZoom(current, dir) {
    const base = Number.isFinite(current) ? Math.round(current / ZOOM_STEP) * ZOOM_STEP : 100;
    const next = base + (dir < 0 ? -ZOOM_STEP : ZOOM_STEP);
    return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
  }

  function toggleTheme(effective) {
    return effective === 'dark' ? 'light' : 'dark';
  }

  function toggleLang(lang) {
    return lang === 'ja' ? 'en' : 'ja';
  }

  // ファイル/テキストエリア共用のインポート解析。DOM に触らない。
  function parseImport(text, version) {
    let raw;
    try {
      raw = JSON.parse(String(text));
    } catch {
      return { ok: false, reason: 'invalid_json' };
    }
    if (raw && typeof raw === 'object' && raw.version > version) return { ok: false, reason: 'unrecognized_format' };
    const settings = migrateStored(raw, version);
    if (Object.keys(settings).length === 0) return { ok: false, reason: 'unrecognized_format' };
    return { ok: true, settings };
  }

  return { VERSION, DATA_VERSION, coerce, resolveSettings, migrateStored, I18N, t, detectLang, effectiveTheme, stepZoom, toggleTheme, toggleLang, parseImport,
    SOUND_FILES, SOUND_GROUPS, EDITOR_ZOOM_LEVELS, formatDateTimeLine };
})();
</script>
<script id="app-ui">
const App = (() => {
  const PAGE = 'l_timer';
  const STORAGE_KEY = `simplePages.${PAGE}`;
  const DATA_KEY = `simplePages.${PAGE}.data`;
  const REPO_URL = 'https://github.com/ytx/simplePages';
  const ABOUT = {
    page: 'l_timer',
    credits: [
      { name: 'Mixkit', url: 'https://mixkit.co/free-sound-effects/notification/', note: '予鈴音 sound1-1 (mixkit-correct-answer-tone-2870) / 終了音 sound2-1 (mixkit-happy-bells-notification-937) / 経過音 sound3-1 (mixkit-access-allowed-tone-2869) — Mixkit License' },
    ],
  };
  const SCHEMA = {
    lang: { type: 'enum', values: ['ja', 'en'], default: Logic.detectLang(navigator.language) },
    theme: { type: 'enum', values: ['auto', 'light', 'dark'], default: 'auto' },
    zoom: { type: 'int', min: 50, max: 200, default: 100 },
    lecture: { type: 'int', min: 1, max: 300, default: 50 },
    break1: { type: 'int', min: 1, max: 120, default: 10 },
    break2: { type: 'int', min: 1, max: 120, default: 60 },
    warning: { type: 'int', min: 1, max: 10, default: 3 },
    tick: { type: 'int', min: 10, max: 300, default: 60 },
    exercise: { type: 'int', min: 1, max: 120, default: 15 },
    nextExercise: { type: 'int', min: 1, max: 120, default: 15 },
    sound1: { type: 'enum', values: Logic.SOUND_GROUPS.sound1, default: 'sound1-1' },
    sound2: { type: 'enum', values: Logic.SOUND_GROUPS.sound2, default: 'sound2-1' },
    sound3: { type: 'enum', values: Logic.SOUND_GROUPS.sound3, default: 'sound3-1' },
    volume: { type: 'int', min: 0, max: 100, default: 50 },
    muted: { type: 'bool', default: false },
    editor: { type: 'bool', default: false },
    editorWidth: { type: 'int', min: 30, max: 70, default: 50 },
    editorZoom: { type: 'enum', values: Logic.EDITOR_ZOOM_LEVELS, default: 100 },
  };
  const IDLE_MS = 10000;
  // すべて表示専用。取得処理はない。
  const DISPLAY_ONLY_KEYS = new Set(['theme', 'zoom', 'lang', 'lecture', 'break1', 'break2', 'warning', 'tick', 'exercise', 'nextExercise', 'sound1', 'sound2', 'sound3', 'volume', 'muted', 'editor', 'editorWidth', 'editorZoom']);

  let settings = {};
  let idleTimer = null;
  let toolbarAttention = false;

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  const storage = {
    read() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
    },
    write(s) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: Logic.VERSION, settings: s })); } catch { /* ignore */ }
    },
    clear() {
      try { localStorage.removeItem(STORAGE_KEY); } catch { /* ignore */ }
    },
  };

  function loadSettings() {
    const query = Object.fromEntries(new URLSearchParams(location.search));
    const stored = Logic.migrateStored(storage.read(), Logic.VERSION);
    settings = Logic.resolveSettings(SCHEMA, stored, query);
    if (query.save === '1') storage.write(settings);
  }

  function getSettings() { return { ...settings }; }

  function updateSettings(patch) {
    const prev = settings;
    settings = Logic.resolveSettings(SCHEMA, { ...settings, ...patch }, {});
    storage.write(settings);
    applySettings();
    const changed = (k) => JSON.stringify(prev[k]) !== JSON.stringify(settings[k]);
    if (Object.keys(patch).some((k) => !DISPLAY_ONLY_KEYS.has(k) && changed(k))) refresh();
  }

  function applyI18n() {
    document.documentElement.lang = settings.lang;
    for (const el of $$('[data-i18n]')) el.textContent = Logic.t(settings.lang, el.dataset.i18n);
    for (const el of $$('[data-i18n-label]')) {
      const s = Logic.t(settings.lang, el.dataset.i18nLabel);
      el.setAttribute('aria-label', s);
      el.title = s;
    }
    for (const el of $$('[data-i18n-placeholder]')) el.placeholder = Logic.t(settings.lang, el.dataset.i18nPlaceholder);
    // data-i18n-label ループの後に実行する: 全画面ボタンのラベルを状態に合った値で上書きするため。
    updateFullscreenButton();
    if (lastStatus) setStatus(lastStatus.state, lastStatus.message);
  }

  function currentTheme() {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    return Logic.effectiveTheme(settings.theme, prefersDark);
  }

  function applyTheme() {
    const theme = currentTheme();
    document.documentElement.dataset.theme = theme;
    // アイコンは「切替先」を表す: ライト表示中は月、ダーク表示中は太陽。
    $('#btn-theme use').setAttribute('href', theme === 'dark' ? '#icon-light-mode' : '#icon-dark-mode');
  }

  function applyZoom(zoom) {
    document.documentElement.style.setProperty('--zoom', String(zoom / 100));
    $('#btn-zoom-in').disabled = Logic.stepZoom(zoom, 1) === zoom;
    $('#btn-zoom-out').disabled = Logic.stepZoom(zoom, -1) === zoom;
  }

  function applySettings() {
    applyI18n();
    tickClock();
    applyTheme();
    applyZoom(settings.zoom);
    for (const el of $$('[data-setting]')) {
      if (el.type === 'checkbox') el.checked = !!settings[el.dataset.setting];
      else el.value = settings[el.dataset.setting];
    }
    $('#volume-value').textContent = `${settings.volume}%`;
    renderSettingsExtra(settings);
  }

  function updateFullscreenButton() {
    const btn = $('#btn-fullscreen');
    if (!document.fullscreenEnabled) { btn.hidden = true; return; }
    const on = !!document.fullscreenElement;
    btn.querySelector('use').setAttribute('href', on ? '#icon-fullscreen-exit' : '#icon-fullscreen');
    btn.setAttribute('aria-label', Logic.t(settings.lang, on ? 'exit_fullscreen' : 'fullscreen'));
  }

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { /* ユーザー操作なしで拒否された場合など。無視して現状維持 */ }
  }

  // ページ側が true にすると減光せず、設定ボタンを強調する(例: 必須設定が未入力)。
  function setToolbarAttention(on) {
    if (!!on === toolbarAttention) return; // 状態が変わらないときは何もしない — 定期更新で減光を解除しないため
    toolbarAttention = !!on;
    $('#btn-settings').classList.toggle('attention', toolbarAttention);
    if (toolbarAttention) $('#toolbar').classList.remove('idle');
    else resetIdle();
  }

  function bindToolbar() {
    $('#btn-theme').addEventListener('click', () => updateSettings({ theme: Logic.toggleTheme(currentTheme()) }));
    $('#btn-zoom-in').addEventListener('click', () => updateSettings({ zoom: Logic.stepZoom(settings.zoom, 1) }));
    $('#btn-zoom-out').addEventListener('click', () => updateSettings({ zoom: Logic.stepZoom(settings.zoom, -1) }));
    $('#btn-fullscreen').addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFullscreenButton);
    $('#btn-lang').addEventListener('click', () => updateSettings({ lang: Logic.toggleLang(settings.lang) }));
    $('#btn-settings').addEventListener('click', () => {
      const sel = $('[role="tab"][aria-selected="true"]') || $$('[role="tab"]')[0];
      showTab(sel.dataset.tab); // データタブの表示内容を最新に
      $('#settings').showModal();
    });
  }

  // message は文字列か、現在言語で文字列を返す関数。関数なら言語切替時に再評価する。
  let lastStatus = null;
  function setStatus(state, message) {
    lastStatus = { state, message };
    $('#status-dot').dataset.state = state;
    const el = $('#status-message');
    el.dataset.state = state;
    el.textContent = (typeof message === 'function' ? message() : message) || '';
  }

  function tickClock() {
    $('#date-line').textContent = Logic.formatDateTimeLine(new Date(), settings.lang);
  }

  // l_timer は何も取得しない。共通 API のため空実装を残す。
  async function refresh() {}

  // ページ固有: 設定変更の即時反映。Task 6〜8 で中身を足す。
  function renderSettingsExtra(_settings) {}

  function onVisibility() {
    if (document.visibilityState === 'visible') tickClock();
  }

  function resetIdle() {
    $('#toolbar').classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (!toolbarAttention) $('#toolbar').classList.add('idle'); }, IDLE_MS);
  }

  function showTab(name) {
    for (const t2 of $$('[role="tab"]')) t2.setAttribute('aria-selected', String(t2.dataset.tab === name));
    for (const p of $$('.tab-panel')) p.classList.toggle('active', p.dataset.panel === name);
    if (name === 'data') refreshDataText();
  }

  function refreshDataText() {
    $('#data-text').value = JSON.stringify({ version: Logic.VERSION, settings }, null, 2);
    setDataMessage('none', '');
  }

  function setDataMessage(state, text) {
    const el = $('#data-message');
    el.dataset.state = state;
    el.textContent = text;
  }

  function importText(text) {
    const result = Logic.parseImport(text, Logic.VERSION);
    if (!result.ok) {
      setDataMessage('error', Logic.t(settings.lang, result.reason === 'invalid_json' ? 'import_failed_json' : 'import_failed_format'));
      return;
    }
    updateSettings(result.settings);
    refreshDataText();
    setDataMessage('ok', Logic.t(settings.lang, 'import_ok'));
  }

  function renderAbout() {
    $('#about-page').href = `${REPO_URL}/tree/main/${ABOUT.page}`;
    const list = $('#about-credits');
    const icons = list.firstElementChild; // credit_icons の li は残す
    list.replaceChildren(...(icons ? [icons] : []));
    for (const c of ABOUT.credits) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = c.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = c.name;
      li.appendChild(a);
      if (c.note) li.appendChild(document.createTextNode(` — ${c.note}`));
      list.appendChild(li);
    }
  }

  function bindSettingsDialog() {
    const dlg = $('#settings');
    $('#settings-close').addEventListener('click', () => dlg.close());
    // 背景クリックで閉じる。テキスト選択などで内側から押して背景で離した場合は閉じない。
    let downOnBackdrop = false;
    dlg.addEventListener('pointerdown', (ev) => { downOnBackdrop = ev.target === dlg; });
    dlg.addEventListener('click', (ev) => {
      if (downOnBackdrop && ev.target === dlg) dlg.close();
      downOnBackdrop = false;
    });
    for (const tab of $$('[role="tab"]')) tab.addEventListener('click', () => showTab(tab.dataset.tab));
    for (const el of $$('[data-setting]')) {
      el.addEventListener('change', () => updateSettings({ [el.dataset.setting]: el.type === 'checkbox' ? el.checked : el.value }));
    }
    $('#set-volume').addEventListener('input', () => { $('#volume-value').textContent = `${$('#set-volume').value}%`; });
    $('#btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ version: Logic.VERSION, settings }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const d = new Date();
      const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      a.download = `simplePages-${PAGE}-${ymd}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    $('#btn-import').addEventListener('click', () => $('#import-file').click());
    $('#import-file').addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      if (file) importText(await file.text());
      ev.target.value = '';
    });
    $('#btn-import-text').addEventListener('click', () => importText($('#data-text').value));
    $('#btn-clear').addEventListener('click', () => {
      if (!confirm(Logic.t(settings.lang, 'confirm_clear'))) return;
      storage.clear();
      try { localStorage.removeItem(DATA_KEY); } catch { /* ignore */ }
      location.href = location.pathname;
    });
    renderAbout();
  }

  function init() {
    loadSettings();
    bindSettingsDialog();
    bindToolbar();
    applySettings();
    tickClock();
    setInterval(tickClock, 1000);
    setStatus('ok', '');
    document.addEventListener('visibilitychange', onVisibility);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    for (const ev of ['pointermove', 'pointerdown', 'touchstart', 'keydown']) document.addEventListener(ev, resetIdle, { passive: true });
    resetIdle();
  }

  document.addEventListener('DOMContentLoaded', init);

  return { getSettings, updateSettings, setStatus, refresh, applyZoom, setToolbarAttention };
})();
