<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zabbix</title>
<style>
:root {
  --bg: #14181e;
  --pane: #1e242c;
  --bg-panel: var(--pane);
  --fg: #f0f0f0;
  --fg-dim: #aaaaaa;
  --fg-muted: var(--fg-dim);
  --border: #2d333f;
  --accent: #5b9cf5;
  --sev-0: #97aab3;
  --sev-1: #7499ff;
  --sev-2: #ffc859;
  --sev-3: #ffa059;
  --sev-4: #e97659;
  --sev-5: #e45959;
  --ok: #5cb85c;
  --disabled: #505050;
  --error-bg: #6e1414;
  --stale-bg: #6e4600;
  --busy: #e6a700;
  --error: #e45959;
  --zoom: 1;
  --radius: 10px;
  --gap: calc(clamp(8px, 1vw, 16px) * var(--zoom));
  --fs-base: calc(clamp(14px, 1.2vw, 20px) * var(--zoom));
  --fs-small: calc(var(--fs-base) * 0.8);
  --fs-large: calc(var(--fs-base) * 1.6);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
html[data-theme="light"] {
  --bg: #f6f7f9;
  --pane: #ffffff;
  --fg: #1c1f26;
  --fg-dim: #5c6370;
  --border: #d9dde3;
  --accent: #2b7de9;
}
@media (prefers-color-scheme: light) {
  html:not([data-theme="dark"]) {
    --bg: #f6f7f9;
    --pane: #ffffff;
    --fg: #1c1f26;
    --fg-dim: #5c6370;
    --border: #d9dde3;
    --accent: #2b7de9;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--fs-base);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#toolbar {
  display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--gap) / 2);
  padding: calc(var(--gap) / 2) var(--gap);
  transition: opacity 0.6s;
}
#toolbar.idle { opacity: 0.15; }
.icon-btn {
  width: 2.2em; height: 2.2em; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-panel); color: var(--fg);
  cursor: pointer; display: grid; place-items: center; padding: 0; font: inherit;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 1.3em; height: 1.3em; fill: currentColor; }
#banner {
  position: fixed; top: 0; left: 0; right: 0; height: 80px; z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 0 24px;
  color: #fff; font-size: 40px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#banner.error { background: var(--error-bg); }
#banner.stale { background: var(--stale-bg); }
#banner[hidden], #measure[hidden] { display: none; }
#toolbar { position: relative; z-index: 60; }
#pane-hosts, #pane-problems { background: var(--pane); min-height: 0; overflow: hidden; padding: 14px; display: flex; flex-direction: column; }
#pane-hosts { border-radius: var(--radius) 0 0 var(--radius); }
#pane-problems { border-radius: 0 var(--radius) var(--radius) 0; border-left: 1px solid var(--border); }
.empty { margin: auto; color: var(--fg-dim); font-size: var(--fs-large); text-align: center; }
.tiles { display: grid; gap: 14px; flex: none; }
.tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 0; padding: 0 6px; border-radius: 4px; overflow: hidden;
  color: #000; text-align: center; line-height: 1.15;
}
.tile .name, .tile .sub { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.ok { background: var(--ok); }
.tile.disabled { background: var(--disabled); }
.tile.sev0 { background: var(--sev-0); }
.tile.sev1 { background: var(--sev-1); }
.tile.sev2 { background: var(--sev-2); }
.tile.sev3 { background: var(--sev-3); }
.tile.sev4 { background: var(--sev-4); }
.tile.sev5 { background: var(--sev-5); }
.more { flex: none; height: 30px; line-height: 30px; text-align: right; color: var(--fg-dim); font-size: 20px; white-space: nowrap; }
.problem {
  display: grid; grid-template-columns: calc(140px * var(--zoom)) minmax(0, 1fr); grid-template-rows: 1fr 1fr;
  height: calc(50px * var(--zoom)); flex: none; overflow: hidden;
}
.problem .sev {
  grid-row: 1 / 3; display: flex; align-items: center; justify-content: center;
  color: #000; font-size: calc(22px * var(--zoom)); white-space: nowrap; overflow: hidden;
}
.sev0 { background: var(--sev-0); }
.sev1 { background: var(--sev-1); }
.sev2 { background: var(--sev-2); }
.sev3 { background: var(--sev-3); }
.sev4 { background: var(--sev-4); }
.sev5 { background: var(--sev-5); }
.problem .host, .problem .desc { padding-left: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.problem .host { font-size: calc(22px * var(--zoom)); line-height: calc(25px * var(--zoom)); }
.problem .desc { font-size: calc(20px * var(--zoom)); line-height: calc(25px * var(--zoom)); color: var(--fg-dim); }
.icon-btn.attention { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
#content {
  flex: 1; min-height: 0; padding: 0 var(--gap) var(--gap);
  display: grid; grid-template-columns: 7fr 3fr; grid-template-rows: auto minmax(0, 1fr); column-gap: 0; row-gap: var(--gap);
}
#page-title { grid-column: 1 / -1; margin: 0; text-align: center; font-size: var(--fs-large); font-weight: 400; }
#status-bar {
  display: flex; justify-content: center; align-items: center; gap: var(--gap);
  padding: calc(var(--gap) / 2) var(--gap);
  border-top: 1px solid var(--border);
  font-size: var(--fs-small); color: var(--fg-muted);
}
#status-message { flex: 1; text-align: right; }
#summary-right { flex: 1; text-align: left; }
#status-dot {
  flex: none; width: 0.7em; height: 0.7em; border-radius: 50%;
  background: var(--fg-muted);
}
#status-dot[data-state="ok"] { background: var(--ok); }
#status-dot[data-state="busy"] { background: var(--busy); }
#status-dot[data-state="error"] { background: var(--error); }
#status-message[data-state="error"] { color: var(--error); }
dialog#settings {
  background: var(--bg-panel); color: var(--fg);
  border: 1px solid var(--border); border-radius: var(--radius);
  width: min(90vw, 36em); height: min(85vh, 32em); padding: 0;
  display: none; grid-template-rows: auto auto 1fr; overflow: hidden;
}
dialog#settings[open] { display: grid; }
dialog#settings::backdrop { background: rgba(0,0,0,0.5); }
dialog#dialog {
  background: var(--bg-panel); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius);
  width: min(90vw, 24em); padding: var(--gap); display: none;
}
dialog#dialog[open] { display: block; }
dialog#dialog::backdrop { background: rgba(0,0,0,0.5); }
#dialog-message { margin: 0 0 var(--gap); white-space: pre-wrap; }
.dialog-actions { display: flex; justify-content: flex-end; gap: calc(var(--gap) / 2); }
.dlg-header { display: flex; align-items: center; padding: calc(var(--gap) / 2) var(--gap); border-bottom: 1px solid var(--border); }
.dlg-header h2 { margin: 0; font-size: var(--fs-base); flex: 1; }
.tabs { display: flex; gap: 2px; padding: 0 var(--gap); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button {
  background: none; border: none; color: var(--fg-muted); padding: 0.6em 1em;
  cursor: pointer; border-bottom: 2px solid transparent; font: inherit; white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab-body { overflow: auto; min-height: 0; }
.tab-panel { display: none; padding: var(--gap); }
.tab-panel.active { display: block; }
.field { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); align-items: center; margin-bottom: var(--gap); }
.field label { color: var(--fg-muted); }
select, input, textarea, button.btn {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.4em 0.6em;
}
textarea#data-text { width: 100%; min-height: 10em; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: var(--fs-small); resize: vertical; }
button.btn { cursor: pointer; }
button.btn.danger { color: var(--error); }
.row { display: flex; gap: var(--gap); flex-wrap: wrap; }
.hint { color: var(--fg-muted); font-size: var(--fs-small); margin: calc(var(--gap) / 2) 0; }
#data-message { min-height: 1.4em; margin-top: calc(var(--gap) / 2); }
#data-message[data-state="error"] { color: var(--error); }
.about h3 { margin: var(--gap) 0 calc(var(--gap) / 3); font-size: var(--fs-base); }
.about ul { margin: 0; padding-left: 1.2em; }
.about a { color: var(--accent); }
</style>
</head>

  <button id="btn-theme" class="icon-btn" type="button" data-i18n-label="toggle_theme"><svg aria-hidden="true"><use href="#icon-dark-mode"></use></svg></button>
  <button id="btn-zoom-out" class="icon-btn" type="button" data-i18n-label="zoom_out"><svg aria-hidden="true"><use href="#icon-zoom-out"></use></svg></button>

</header>

  <div id="banner" hidden></div>
  <section id="pane-hosts"></section>
  <section id="pane-problems"></section>
  <canvas id="measure" hidden></canvas>
</main>

      <textarea id="data-text" spellcheck="false"></textarea>
      <div class="row">
        <button type="button" class="btn" id="btn-copy-text" data-i18n="copy_text"></button>

      <div id="data-message" data-state="none"></div>
    </section>

    </section>
  </div>
</dialog>
<dialog id="dialog">
  <form method="dialog">
    <p id="dialog-message"></p>
    <div class="dialog-actions">
      <button id="dialog-cancel" class="btn" type="button" data-i18n="cancel"></button>
      <button id="dialog-ok" class="btn" type="submit" value="ok" data-i18n="ok"></button>
    </div>
  </form>
</dialog>
<script id="app-logic">
const Logic = (() => {
  const VERSION = 1;
  // version n の settings を n+1 へ変換する関数を MIGRATIONS[n] に置く。
  const MIGRATIONS = {};

  function coerce(spec, value) {
    if (value === undefined || value === null) return undefined;
    switch (spec.type) {
      case 'int': {
        const n = typeof value === 'number' ? value : Number.parseInt(String(value), 10);
        if (!Number.isInteger(n)) return undefined;
        // 範囲外は端に丸める(Zabbix の設定は多少ずれていても動かしたい)
        let c = n;
        if (spec.min !== undefined && c < spec.min) c = spec.min;

  function t(lang, key, params) {

    if (setting === 'light' || setting === 'dark') return setting;

  function parseImport(text, version) {
    let raw;

    } catch {

    if (host.disabled) return 'disabled';

  const PANE_GAP = 14;
  function splitName(name) {

    const aspect = availW / Math.max(availH, 1);
    const cols = Math.max(1, Math.min(n, 8, Math.round(Math.sqrt(n * aspect))));
    let rows = Math.ceil(n / cols);
    const tileW = Math.floor((availW - PANE_GAP * (cols - 1)) / cols);
    let tileH = Math.floor((availH - PANE_GAP * (rows - 1)) / rows);
    let visible = n;
    let truncated = false;
    if (tileH < 40) {
      rows = Math.max(1, Math.floor((availH + PANE_GAP) / 54));
      tileH = Math.floor((availH - PANE_GAP * (rows - 1)) / rows);

      truncated = visible < n;

    return Math.min(count, maxRows, Math.max(1, Math.floor((paneH - 24 - 30) / 50)));
  }
  function summaryText(summary, lang, tr) {
    const parts = [];
    for (let i = 5; i >= 0; i--) if (summary.bySeverity[i] > 0) parts.push(SEVERITY_SHORT[i] + ':' + summary.bySeverity[i]);
    return {
      left: tr(lang, 'hosts_summary', { n: summary.hostsTotal, ok: summary.hostsOk, bad: summary.hostsBad }),
      right: tr(lang, 'problems_summary', { n: summary.problems, sev: parts.length ? parts.join('  ') : '-' }),
    };
  }

    return lastOkAt != null && now - lastOkAt >= staleSec * 1000;
  }
  function ageText(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  }

  return { VERSION, coerce, resolveSettings, migrateStored, I18N, t, detectLang, effectiveTheme, stepZoom, toggleTheme, toggleLang, parseImport, SEVERITY_NAMES, SEVERITY_SHORT, normalizeUrl, parseList, apiRequest, apiResult, orderHosts, mergeData, hostColorKey, splitName, fitFontSize, tileLayout, tileFontSize, visibleRows, summaryText, isStale, ageText };

  }

  function tr(key, params) { return Logic.t(settings.lang, key, params); }

  // 帯: STALE が失敗より優先。どちらでもなければ隠す。
  function updateBanner(now) {
    const b = $('#banner');
    let cls = '';
    let text = '';
    if (!needSetup && Logic.isStale(lastOkAt, now, settings.staleSec)) {
      cls = 'stale';
      text = tr('stale', { t: formatTime(new Date(lastOkAt)), age: Logic.ageText(now - lastOkAt) });
    } else if (!needSetup && lastError) {
      cls = 'error';
      text = tr('conn_failed', { reason: lastError });
    }
    b.hidden = cls === '';
    b.className = cls;
    if (b.textContent !== text) b.textContent = text;
  }

  // JSON-RPC 呼び出し。失敗は理由の文字列を持つ Error で投げる。
  async function api(method, params) {
    const body = JSON.stringify(Logic.apiRequest(method, params, settings.token, ++requestId));
    let r;
    try {
      r = await fetch(Logic.normalizeUrl(settings.zabbixUrl) + '/api_jsonrpc.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
        cache: 'no-store',
        signal: AbortSignal.timeout(settings.requestTimeoutSec * 1000),
      });
    } catch (e) {
      throw new Error(e && (e.name === 'TimeoutError' || e.name === 'AbortError') ? e.name : ((e && e.message) || 'network'));
    }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    let json;
    try { json = await r.json(); } catch { throw new Error('Invalid response'); }
    const res = Logic.apiResult(json);
    if (!res.ok) throw new Error(res.error);
    return res.result;
  }

  async function fetchModel() {
    const names = Logic.parseList(settings.hostGroups);
    const groups = await api('hostgroup.get', names.length ? { filter: { name: names }, output: ['groupid', 'name'] } : { output: ['groupid', 'name'] });
    if (!Array.isArray(groups) || groups.length === 0) throw new Error(tr('no_groups', { names: names.join(', ') }));
    const groupids = groups.map((g) => g.groupid);
    const hosts = Logic.orderHosts(
      await api('host.get', { groupids, output: ['hostid', 'host', 'name', 'status'], sortfield: ['name'] }),
      Logic.parseList(settings.hosts));
    const severities = [];
    for (let i = settings.severityMin; i <= 5; i++) severities.push(i);
    const problems = await api('problem.get', { groupids, severities, output: 'extend', sortfield: ['eventid'], sortorder: 'DESC' });
    const triggerids = Array.from(new Set(problems.map((p) => p.objectid)));
    const triggers = triggerids.length
      ? await api('trigger.get', { triggerids, output: ['triggerid'], selectHosts: ['hostid', 'name'], monitored: true })
      : [];
    return Logic.mergeData(hosts, problems, triggers);
  }

  function leftText() {
    return model ? Logic.summaryText(model.summary, settings.lang, Logic.t).left : '';
  }

  async function refresh() {
    const gen = ++refreshGen;
    if (Logic.normalizeUrl(settings.zabbixUrl) === '' || settings.token === '') {
      needSetup = true;
      setToolbarAttention(true);
      setStatus('none', '');
      render();
      return;
    }
    needSetup = false;
    setToolbarAttention(false);
    setStatus('busy', leftText);
    try {
      const merged = await fetchModel();
      if (gen !== refreshGen) return; // 後から始まった更新があるので捨てる
      model = merged;
      lastOkAt = Date.now();
      lastError = null;
      setStatus('ok', leftText);
    } catch (e) {
      if (gen !== refreshGen) return;
      lastError = (e && e.message) || 'error';
      const reason = lastError;
      setStatus('error', () => tr('error_fetch', { reason }));
    }
    render();
  }

  // ---- 描画 ----
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function showEmpty(pane, key) {
    pane.replaceChildren(el('div', 'empty', tr(key)));
  }

  function measureWidths(texts) {
    const ctx = $('#measure').getContext('2d');
    ctx.font = '100px ' + getComputedStyle(document.body).fontFamily;
    return texts.map((x) => (x ? ctx.measureText(x).width : 0));
  }

  function renderHosts() {
    const pane = $('#pane-hosts');
    if (needSetup) { showEmpty(pane, 'need_setup'); return; }
    if (!model) { showEmpty(pane, 'no_data'); return; }
    const all = model.hosts;
    if (all.length === 0) { showEmpty(pane, 'no_hosts'); return; }
    const rect = pane.getBoundingClientRect();
    const lay = Logic.tileLayout(all.length, rect.width - 28, rect.height - 28);
    const vis = all.slice(0, lay.visible);
    const parts = vis.map((h) => Logic.splitName(h.name));
    const n = settings.tileMinChars;
    const headLimit = Logic.fitFontSize(measureWidths(parts.map((x) => x[0].slice(0, n))), lay.tileW - 12, 1);
    const tailLimit = Logic.fitFontSize(measureWidths(parts.map((x) => x[1].slice(0, n))), lay.tileW - 12, 0.7);
    const fs = Logic.tileFontSize(lay.tileH, [headLimit, tailLimit].filter((x) => x !== null), settings.tileMinFont);
    const grid = el('div', 'tiles');
    grid.style.gridTemplateColumns = `repeat(${lay.cols}, minmax(0, 1fr))`;
    grid.style.gridAutoRows = `${lay.tileH}px`;
    vis.forEach((h, i) => {
      const tile = el('div', 'tile ' + Logic.hostColorKey(h));
      tile.style.fontSize = fs.nameSize + 'px';
      tile.appendChild(el('span', 'name', parts[i][0]));
      if (parts[i][1]) {
        const sub = el('span', 'sub', parts[i][1]);
        sub.style.fontSize = fs.subSize + 'px';
        sub.style.marginTop = fs.lineGap + 'px';
        tile.appendChild(sub);
      }
      grid.appendChild(tile);
    });
    const kids = [grid];
    if (lay.truncated) kids.push(el('div', 'more', tr('more', { n: all.length - lay.visible, total: all.length })));
    pane.replaceChildren(...kids);
  }

  function renderProblems() {
    const pane = $('#pane-problems');
    if (needSetup || !model) { pane.replaceChildren(); return; }
    const all = model.problems;
    if (all.length === 0) { showEmpty(pane, 'no_problems'); return; }
    const zoom = settings.zoom / 100;
    const rows = Logic.visibleRows(all.length, settings.problemMaxRows, pane.getBoundingClientRect().height / zoom);
    const kids = all.slice(0, rows).map((p) => {
      const sev = Math.min(5, Math.max(0, Number(p.severity) || 0));
      const row = el('div', 'problem');
      row.appendChild(el('span', 'sev sev' + sev, Logic.SEVERITY_NAMES[sev]));
      row.appendChild(el('span', 'host', p.hostName));
      row.appendChild(el('span', 'desc', p.name));
      return row;
    });
    if (rows < all.length) kids.push(el('div', 'more', tr('more', { n: all.length - rows, total: all.length })));
    pane.replaceChildren(...kids);
  }

  function renderFooter() {
    $('#summary-right').textContent = model ? Logic.summaryText(model.summary, settings.lang, Logic.t).right : '';
  }

  function render() {
    renderHosts();
    renderProblems();
    renderFooter();
    tickClock();
  }

  // ページ固有: 設定タブに項目を追加する。
  function renderSettingsExtra(_settings) {}

  function scheduleRefresh(delayMs) {
    clearTimeout(refreshTimer);
    const delay = delayMs ?? settings.refreshSec * 1000;
    nextRefreshAt = Date.now() + delay;
    // 古い更新の finally が新しい予約を消さないように、自分のタイマーが現役のときだけ再予約する
    const mine = setTimeout(async () => {
      try { await refresh(); } finally { if (refreshTimer === mine) scheduleRefresh(); }
    }, delay);
    refreshTimer = mine;
  }

  function onVisibility() {
    if (document.visibilityState === 'visible' && Date.now() >= nextRefreshAt) scheduleRefresh(0);
  }

  function resetIdle() {
    $('#toolbar').classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (!toolbarAttention) $('#toolbar').classList.add('idle'); }, IDLE_MS);
  }

  function showTab(name) {
    for (const t2 of $$('[role="tab"]')) t2.setAttribute('aria-selected', String(t2.dataset.tab === name));
    for (const p of $$('.tab-panel')) p.classList.toggle('active', p.dataset.panel === name);
    if (name === 'data') refreshDataText();
  }

  function refreshDataText() {
    $('#data-text').value = JSON.stringify({ version: Logic.VERSION, settings }, null, 2);
    setDataMessage('none', '');
  }

  // 確認ダイアログ。{ ok } を返す Promise。danger は OK ボタンを赤にする。
  function dialog({ message, okLabel = '', danger = false }) {
    return new Promise((resolve) => {
      const dlg = $('#dialog');
      const okBtn = $('#dialog-ok');
      $('#dialog-message').textContent = message;
      okBtn.textContent = okLabel || Logic.t(settings.lang, 'ok');
      okBtn.classList.toggle('danger', !!danger);
      const onClose = () => {
        dlg.removeEventListener('close', onClose);
        resolve({ ok: dlg.returnValue === 'ok' });
      };
      dlg.addEventListener('close', onClose);
      dlg.returnValue = '';
      dlg.showModal();
    });
  }

  // クリップボードへコピー。writeText が返ってこない端末があるので 1.5 秒で打ち切り、execCommand に落とす。
  async function copyText(text, area) {
    try {
      let timer;
      const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 1500); });
      try { await Promise.race([navigator.clipboard.writeText(text), timeout]); } finally { clearTimeout(timer); }
      return true;
    } catch { /* フォールバックへ */ }
    try {
      area.focus();
      area.select();
      return !!document.execCommand('copy');
    } catch {
      return false;
    }
  }

  function setDataMessage(state, text) {
    const el = $('#data-message');
    el.dataset.state = state;
    el.textContent = text;
  }

  function importText(text) {
    const result = Logic.parseImport(text, Logic.VERSION);
    if (!result.ok) {
      setDataMessage('error', Logic.t(settings.lang, result.reason === 'invalid_json' ? 'import_failed_json' : 'import_failed_format'));
      return;
    }
    updateSettings(result.settings);
    refreshDataText();
    setDataMessage('ok', Logic.t(settings.lang, 'import_ok'));
  }

  function renderAbout() {
    $('#about-page').href = `${REPO_URL}/tree/main/${ABOUT.page}`;
    const list = $('#about-credits');
    const icons = list.firstElementChild; // credit_icons の li は残す
    list.replaceChildren(...(icons ? [icons] : []));
    for (const c of ABOUT.credits) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = c.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = c.name;
      li.appendChild(a);
      if (c.note) li.appendChild(document.createTextNode(` — ${c.note}`));
      list.appendChild(li);
    }
  }

  function bindSettingsDialog() {
    const dlg = $('#settings');
    $('#settings-close').addEventListener('click', () => dlg.close());
    // 背景クリックで閉じる。テキスト選択などで内側から押して背景で離した場合は閉じない。
    let downOnBackdrop = false;
    dlg.addEventListener('pointerdown', (ev) => { downOnBackdrop = ev.target === dlg; });
    dlg.addEventListener('click', (ev) => {
      if (downOnBackdrop && ev.target === dlg) dlg.close();
      downOnBackdrop = false;
    });
    for (const tab of $$('[role="tab"]')) tab.addEventListener('click', () => showTab(tab.dataset.tab));
    for (const el of $$('[data-setting]')) {
      el.addEventListener('change', () => updateSettings({ [el.dataset.setting]: el.value }));
    }
    $('#btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ version: Logic.VERSION, settings }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const d = new Date();
      const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      a.download = `simplePages-${PAGE}-${ymd}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    $('#btn-import').addEventListener('click', () => $('#import-file').click());
    $('#import-file').addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      if (file) importText(await file.text());
      ev.target.value = '';
    });
    $('#btn-copy-text').addEventListener('click', async () => {
      const ta = $('#data-text');
      const ok = await copyText(ta.value, ta);
      setDataMessage(ok ? 'ok' : 'error', Logic.t(settings.lang, ok ? 'copied' : 'copy_failed'));
    });
    $('#btn-import-text').addEventListener('click', () => importText($('#data-text').value));
    $('#btn-clear').addEventListener('click', async () => {
      if (!(await dialog({ message: Logic.t(settings.lang, 'confirm_clear'), danger: true })).ok) return;
      storage.clear();
      location.href = location.pathname;
    });
    $('#dialog-cancel').addEventListener('click', () => $('#dialog').close());
    renderAbout();
  }

  function init() {
    loadSettings();
    bindSettingsDialog();
    bindToolbar();
    applySettings();
    scheduleRefresh(0);
    render();
    setInterval(tickClock, 1000);
    document.addEventListener('visibilitychange', onVisibility);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 200); });
    for (const ev of ['pointermove', 'pointerdown', 'touchstart', 'keydown']) document.addEventListener(ev, resetIdle, { passive: true });
    resetIdle();
  }

  document.addEventListener('DOMContentLoaded', init);

  return { getSettings, updateSettings, setStatus, scheduleRefresh, refresh, applyZoom, setToolbarAttention, dialog, copyText };
})();
</script>
</body>
</html>
