<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<style>
:root {
  --bg: #f6f7f9;
  --bg-panel: #ffffff;
  --fg: #1c1f26;
  --fg-muted: #5c6370;
  --border: #d9dde3;
  --accent: #2b7de9;
  --ok: #2fa84f;
  --busy: #e6a700;
  --error: #d64545;
  --zoom: 1;
  --radius: 10px;
  --gap: calc(clamp(8px, 1vw, 16px) * var(--zoom));
  --fs-base: calc(clamp(14px, 1.2vw, 20px) * var(--zoom));
  --fs-small: calc(var(--fs-base) * 0.8);
  --fs-large: calc(var(--fs-base) * 1.6);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
html[data-theme="dark"] {
  --bg: #12151b;
  --bg-panel: #1b1f27;
  --fg: #e7eaf0;
  --fg-muted: #9aa3b2;
  --border: #2d333f;
  --accent: #5b9cf5;
}
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --bg: #12151b; --bg-panel: #1b1f27; --fg: #e7eaf0; --fg-muted: #9aa3b2; --border: #2d333f; --accent: #5b9cf5;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--fs-base);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#toolbar {
  display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--gap) / 2);
  padding: calc(var(--gap) / 2) var(--gap);
  transition: opacity 0.6s;
}
#toolbar.idle { opacity: 0.15; }
.icon-btn {
  width: 2.2em; height: 2.2em; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-panel); color: var(--fg);
  cursor: pointer; display: grid; place-items: center; padding: 0; font: inherit;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 1.3em; height: 1.3em; fill: currentColor; }
.icon-btn.attention { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
#content { flex: 1; min-height: 0; padding: 0 var(--gap) var(--gap); }
#status-bar {
  display: flex; justify-content: center; align-items: center; gap: var(--gap);
  padding: calc(var(--gap) / 2) var(--gap);
  border-top: 1px solid var(--border);
  font-size: var(--fs-small); color: var(--fg-muted);
}
#status-dot {
  width: 0.7em; height: 0.7em; border-radius: 50%;
  background: var(--fg-muted);
}
#status-dot[data-state="ok"] { background: var(--ok); }
#status-dot[data-state="busy"] { background: var(--busy); }
#status-dot[data-state="error"] { background: var(--error); }
#status-message[data-state="error"] { color: var(--error); }
dialog#settings {
  background: var(--bg-panel); color: var(--fg);
  border: 1px solid var(--border); border-radius: var(--radius);
  width: min(90vw, 36em); height: min(85vh, 32em); padding: 0;
  display: none; grid-template-rows: auto auto 1fr; overflow: hidden;
}
dialog#settings[open] { display: grid; }
dialog#settings::backdrop { background: rgba(0,0,0,0.5); }
.dlg-header { display: flex; align-items: center; padding: calc(var(--gap) / 2) var(--gap); border-bottom: 1px solid var(--border); }
.dlg-header h2 { margin: 0; font-size: var(--fs-base); flex: 1; }
.tabs { display: flex; gap: 2px; padding: 0 var(--gap); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button {
  background: none; border: none; color: var(--fg-muted); padding: 0.6em 1em;
  cursor: pointer; border-bottom: 2px solid transparent; font: inherit; white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab-body { overflow: auto; min-height: 0; }
.tab-panel { display: none; padding: var(--gap); }
.tab-panel.active { display: block; }
.field { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); align-items: center; margin-bottom: var(--gap); }
.field label { color: var(--fg-muted); }
select, input, textarea, button.btn {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.4em 0.6em;
}
textarea#data-text { width: 100%; min-height: 10em; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: var(--fs-small); resize: vertical; }
button.btn { cursor: pointer; }
button.btn.danger { color: var(--error); }
.row { display: flex; gap: var(--gap); flex-wrap: wrap; }
.hint { color: var(--fg-muted); font-size: var(--fs-small); margin: calc(var(--gap) / 2) 0; }
#data-message { min-height: 1.4em; margin-top: calc(var(--gap) / 2); }
#data-message[data-state="error"] { color: var(--error); }
.about h3 { margin: var(--gap) 0 calc(var(--gap) / 3); font-size: var(--fs-base); }
.about ul { margin: 0; padding-left: 1.2em; }
.about a { color: var(--accent); }
/* ---- calendar ---- */
#status-dot[data-state="warn"] { background: var(--busy); }
#content { display: flex; flex-direction: column; gap: calc(var(--gap) / 2); }
#no-connection { flex: 1; display: grid; place-items: center; font-size: var(--fs-large); color: var(--fg-muted); text-align: center; }
#no-connection[hidden], #cal-wrap[hidden], #range-title[hidden], .month[hidden], .timegrid[hidden], #popover[hidden] { display: none; }
#range-title { margin: 0; text-align: center; font-size: var(--fs-large); font-weight: 600; line-height: 1.2; }
#cal-wrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
/* カルーセル: 3 枚(前・現在・翌)を横に並べたトラックを 1 枚分左にずらして現在を見せる */
#cal { flex: 1; min-height: 0; display: flex; width: 300%; transform: translateX(calc(-100% / 3)); touch-action: none; user-select: none; will-change: transform; }
#cal.animate { transition: transform 0.25s ease-out; }
.pane { flex: 0 0 calc(100% / 3); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane:not(.current) { pointer-events: none; }
.swipe-hint {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; pointer-events: none;
  padding: 0.4em 0.8em; border-radius: 999px; font-size: var(--fs-large); font-weight: 600; white-space: nowrap;
  background: var(--bg-panel); color: var(--fg-muted); border: 2px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  opacity: 0; transition: opacity 0.15s, transform 0.15s;
}
.swipe-hint.prev { left: var(--gap); }
.swipe-hint.next { right: var(--gap); }
.swipe-hint.show { opacity: 0.6; }
.swipe-hint.armed { opacity: 1; color: #fff; background: var(--accent); border-color: var(--accent); transform: translateY(-50%) scale(1.1); }
@media (prefers-reduced-motion: reduce) { #cal.animate { transition: none; } }
.timegrid { flex: 1; min-height: 0; display: flex; flex-direction: column; --hour-col: 3.6em; }
.day-headers, .allday { display: grid; grid-template-columns: var(--hour-col) repeat(var(--cols, 7), 1fr); }
.day-headers { border-bottom: 1px solid var(--border); }
.day-head { text-align: center; padding: 0.2em 0; font-size: var(--fs-small); color: var(--fg-muted); }
.day-head .dnum { display: inline-block; min-width: 1.6em; padding: 0.1em 0.3em; border-radius: 1em; font-size: var(--fs-base); color: var(--fg); font-weight: 600; }
.day-head.today .dnum { background: var(--accent); color: #fff; }
.day-head .wd { margin-left: 0.3em; }
.allday { grid-auto-rows: 1.5em; gap: 2px 0; padding: 2px 0; border-bottom: 1px solid var(--border); min-height: calc(1.5em + 4px); }
.allday .corner { grid-column: 1; grid-row: 1; font-size: var(--fs-small); color: var(--fg-muted); padding-right: 0.4em; text-align: right; align-self: center; }
.bar { font-size: var(--fs-small); line-height: 1.5em; padding: 0 0.4em; margin: 0 1px; border-radius: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
.bar.cont-left { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.bar.cont-right { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.bar.more { background: none; color: var(--fg-muted); cursor: default; }
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--hour-col) repeat(var(--cols, 7), 1fr); }
.hours { position: relative; }
.hour-label { position: absolute; right: 0.4em; transform: translateY(-50%); font-size: var(--fs-small); color: var(--fg-muted); }
.day-col {
  position: relative; border-left: 1px solid var(--border); min-width: 0;
  background-image: linear-gradient(to bottom, var(--border) 1px, transparent 1px);
  background-size: 100% calc(100% / var(--hours, 17));
  overflow: hidden;
}
.day-col.today { background-color: color-mix(in srgb, var(--accent) 6%, transparent); }
.ev {
  position: absolute; box-sizing: border-box; border-radius: 4px; padding: 0.1em 0.3em; overflow: hidden;
  font-size: var(--fs-small); line-height: 1.25; min-height: 1.25em; cursor: pointer; border: 1px solid rgba(0,0,0,0.15);
}
.ev.clip-top { border-top-left-radius: 0; border-top-right-radius: 0; }
.ev.clip-bottom { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.ev .ev-time { opacity: 0.85; margin-right: 0.3em; }
.now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--error); pointer-events: none; z-index: 2; }
.now-line::before { content: ''; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--error); }
.month { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
.mhead { background: var(--bg-panel); text-align: center; font-size: var(--fs-small); color: var(--fg-muted); padding: 0.2em 0; }
.cell { background: var(--bg-panel); min-height: 0; overflow: hidden; padding: 2px 3px; font-size: var(--fs-small); }
.cell.out { background: var(--bg); color: var(--fg-muted); }
.cell .dnum { font-weight: 600; display: inline-block; min-width: 1.6em; text-align: center; border-radius: 1em; padding: 0 0.3em; }
.cell.today .dnum { background: var(--accent); color: #fff; }
.mitem { line-height: 1.35; padding: 0 0.3em; border-radius: 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
.mitem:not(.allday)::before { content: ''; display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--dot, var(--accent)); margin-right: 0.3em; vertical-align: middle; }
.mitem.more { color: var(--fg-muted); cursor: default; }
#nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--gap); padding-top: calc(var(--gap) / 2); }
.nav-group { display: flex; gap: var(--gap); }
.nav-btn {
  min-height: calc(48px * var(--zoom)); min-width: calc(48px * var(--zoom)); padding: 0 1.2em;
  font: inherit; font-size: var(--fs-base); color: var(--fg); background: var(--bg-panel);
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
}
.nav-btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
#popover {
  position: fixed; z-index: 20; background: var(--bg-panel); color: var(--fg); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,0.25); padding: var(--gap); max-width: min(90vw, 26em); max-height: 60vh; overflow: auto;
}
.pop-title { font-weight: 600; font-size: var(--fs-base); margin-bottom: 0.3em; }
.pop-line { font-size: var(--fs-small); margin: 0.15em 0; }
.pop-line.muted { color: var(--fg-muted); }
.pop-desc { font-size: var(--fs-small); margin-top: 0.5em; white-space: pre-wrap; }
#cal-list { display: grid; gap: 0.3em; margin: 0.5em 0; }
#cal-list label { display: flex; align-items: center; gap: 0.5em; }
#cal-list input[type="color"] { width: 2.2em; height: 1.6em; padding: 0; border: 1px solid var(--border); }
#conn-message { min-height: 1.4em; margin: 0.3em 0; }
.code-head { align-items: center; }
.code-head .hint { margin: 0; flex: 1; }
#conn-message[data-state="error"] { color: var(--error); }
textarea#gas-code { width: 100%; min-height: 12em; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: var(--fs-small); }
.steps { padding-left: 1.4em; font-size: var(--fs-small); }
.steps li { margin: 0.3em 0; }
</style>
</head>

<header id="toolbar">
  <button id="btn-theme" class="icon-btn" type="button" data-i18n-label="toggle_theme"><svg aria-hidden="true"><use href="#icon-dark-mode"></use></svg></button>
  <button id="btn-zoom-out" class="icon-btn" type="button" data-i18n-label="zoom_out"><svg aria-hidden="true"><use href="#icon-zoom-out"></use></svg></button>
  <button id="btn-zoom-in" class="icon-btn" type="button" data-i18n-label="zoom_in"><svg aria-hidden="true"><use href="#icon-zoom-in"></use></svg></button>
  <button id="btn-fullscreen" class="icon-btn" type="button" data-i18n-label="fullscreen"><svg aria-hidden="true"><use href="#icon-fullscreen"></use></svg></button>
  <button id="btn-lang" class="icon-btn" type="button" data-i18n-label="toggle_lang"><svg aria-hidden="true"><use href="#icon-translate"></use></svg></button>
  <button id="btn-settings" class="icon-btn" type="button" data-i18n-label="settings"><svg aria-hidden="true"><use href="#icon-settings"></use></svg></button>
</header>
<main id="content">
  <div id="no-connection" hidden><span data-i18n="set_connection_hint"></span></div>
  <h1 id="range-title"></h1>
  <div id="cal-wrap">
    <div id="cal">
      <div class="pane"><div class="timegrid"><div class="day-headers"></div><div class="allday"></div><div class="grid"></div></div><div class="month" hidden></div></div>
      <div class="pane current"><div class="timegrid"><div class="day-headers"></div><div class="allday"></div><div class="grid"></div></div><div class="month" hidden></div></div>
      <div class="pane"><div class="timegrid"><div class="day-headers"></div><div class="allday"></div><div class="grid"></div></div><div class="month" hidden></div></div>
    </div>
    <div class="swipe-hint prev" id="swipe-prev" aria-hidden="true" data-i18n="prev"></div>
    <div class="swipe-hint next" id="swipe-next" aria-hidden="true" data-i18n="next"></div>
  </div>
  <nav id="nav">
    <div class="nav-group">
      <button class="nav-btn" id="btn-prev" type="button" data-i18n="prev"></button>
      <button class="nav-btn" id="btn-today" type="button" data-i18n="today"></button>
      <button class="nav-btn" id="btn-next" type="button" data-i18n="next"></button>
    </div>
    <div class="nav-group" role="group">
      <button class="nav-btn view-btn" type="button" data-view="day" aria-pressed="false" data-i18n="view_day"></button>
      <button class="nav-btn view-btn" type="button" data-view="week" aria-pressed="false" data-i18n="view_week"></button>
      <button class="nav-btn view-btn" type="button" data-view="month" aria-pressed="false" data-i18n="view_month"></button>
    </div>
  </nav>
</main>
<div id="popover" hidden role="dialog" aria-live="polite"></div>
<footer id="status-bar">
  <span id="clock"></span>
  <span id="status-message"></span>
  <span id="status-dot" data-state="none"></span>
</footer>
<dialog id="settings">
  <div class="dlg-header">
    <h2 data-i18n="settings"></h2>
    <button id="settings-close" class="icon-btn" type="button" data-i18n-label="close"><svg aria-hidden="true"><use href="#icon-close"></use></svg></button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="connection" data-i18n="tab_connection"></button>
    <button role="tab" data-tab="general" aria-selected="true" data-i18n="tab_general"></button>
    <button role="tab" data-tab="display" data-i18n="tab_display"></button>
    <button role="tab" data-tab="data" data-i18n="tab_data"></button>
    <button role="tab" data-tab="about" data-i18n="tab_about"></button>
  </div>
  <div class="tab-body">
    <section class="tab-panel" data-panel="connection">
      <div class="field">
        <label for="set-gas-url" data-i18n="gas_url"></label>
        <input id="set-gas-url" type="url" data-setting="gasUrl" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false">
      </div>
      <div class="field">
        <label for="set-token" data-i18n="token"></label>
        <input id="set-token" type="text" data-setting="token" autocomplete="off" spellcheck="false">

      <textarea id="gas-code" readonly spellcheck="false">// simplePages calendar — Google Apps Script ウェブアプリ
// デプロイ: 種類「ウェブアプリ」/ 次のユーザーとして実行「自分」/ アクセスできるユーザー「全員」
// 設定を変えたら「デプロイを管理」から同じデプロイを新バージョンで更新する(URL は変わらない)。

const TOKEN = ''; // 空なら認証なし。値を入れたら calendar ページの「トークン」にも同じ値を入れる
const MAX_DAYS = 120;

// CalendarEvent.getColor() は色番号("1"〜"11")を返すので 16 進に変換する
const EVENT_COLORS = {
  '1': '#a4bdfc', '2': '#7ae7bf', '3': '#dbadff', '4': '#ff887c', '5': '#fbd75b', '6': '#ffb878',
  '7': '#46d6db', '8': '#e1e1e1', '9': '#5484ed', '10': '#51b749', '11': '#dc2127',
};

function doGet(e) {
  const p = (e &amp;&amp; e.parameter) || {};
  try {
    if (TOKEN &amp;&amp; p.token !== TOKEN) return json({ ok: false, error: 'unauthorized' });
    const tz = Session.getScriptTimeZone();
    if (p.action === 'list') return json({ ok: true, tz: tz, generatedAt: iso(new Date(), tz), calendars: listCalendars() });
    const from = parseYmd(p.from), to = parseYmd(p.to);
    if (!from || !to || to &lt;= from) return json({ ok: false, error: 'bad_request' });
    if (Math.round((to - from) / 86400000) &gt; MAX_DAYS) return json({ ok: false, error: 'range_too_large' });
    const wanted = p.cal ? String(p.cal).split(',').map(function (s) { return s.trim(); }).filter(Boolean) : null;
    const calendars = wanted
      ? wanted.map(function (id) {
          try { return CalendarApp.getCalendarById(id) || { missing: id }; } catch (err) { return { missing: id }; }
        })
      : CalendarApp.getAllCalendars();
    const outCals = [], events = [], errors = [];
    calendars.forEach(function (c) {
      if (c.missing) { errors.push({ calendarId: c.missing, error: 'not_found' }); return; }
      const id = c.getId(), calColor = hex(c.getColor());
      outCals.push({ id: id, name: c.getName(), color: calColor });
      try {
        c.getEvents(from, to).forEach(function (ev) {
          const allDay = ev.isAllDayEvent();
          events.push({
            id: ev.getId() + '_' + Utilities.formatDate(ev.getStartTime(), 'UTC', "yyyyMMdd'T'HHmmss'Z'"), calendarId: id, title: ev.getTitle(),
            start: allDay ? ymd(ev.getAllDayStartDate(), tz) : iso(ev.getStartTime(), tz),
            end: allDay ? ymd(ev.getAllDayEndDate(), tz) : iso(ev.getEndTime(), tz),
            allDay: allDay,
            location: ev.getLocation() || '',
            description: plainText(ev.getDescription() || ''),
            color: EVENT_COLORS[ev.getColor()] || calColor,
          });
        });
      } catch (err) {
        errors.push({ calendarId: id, error: String((err &amp;&amp; err.message) || err) });
      }
    });
    return json({ ok: true, tz: tz, generatedAt: iso(new Date(), tz), calendars: outCals, events: events, errors: errors });
  } catch (err) {
    return json({ ok: false, error: 'internal', detail: String((err &amp;&amp; err.message) || err) });
  }
}

function listCalendars() {
  return CalendarApp.getAllCalendars().map(function (c) { return { id: c.getId(), name: c.getName(), color: hex(c.getColor()) }; });
}
function parseYmd(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
}
function iso(d, tz) { return Utilities.formatDate(d, tz, "yyyy-MM-dd'T'HH:mm:ssXXX"); }
function ymd(d, tz) { return Utilities.formatDate(d, tz, 'yyyy-MM-dd'); }
function hex(c) { const m = /^#?([0-9a-fA-F]{6})$/.exec(String(c || '')); return m ? '#' + m[1].toLowerCase() : ''; }
// 説明は HTML で返ることがあるのでタグを落として改行だけ残す
function plainText(s) {
  return String(s).replace(/&lt;br\s*\/?&gt;/gi, '\n').replace(/&lt;\/p&gt;/gi, '\n').replace(/&lt;[^&gt;]+&gt;/g, '')
    .replace(/&amp;nbsp;/g, ' ').replace(/&amp;lt;/g, '&lt;').replace(/&amp;gt;/g, '&gt;').replace(/&amp;quot;/g, '"').replace(/&amp;#39;/g, "'").replace(/&amp;#(\d+);/g, function (_, n) { return String.fromCharCode(Number(n)); }).replace(/&amp;#x([0-9a-f]+);/gi, function (_, h) { return String.fromCharCode(parseInt(h, 16)); })
    .replace(/&amp;amp;/g, '&amp;')
    .replace(/\n{3,}/g, '\n\n').trim();
}
function json(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

<script id="app-logic">
const Logic = (() => {
  const VERSION = 1;
  // version n の settings を n+1 へ変換する関数を MIGRATIONS[n] に置く。
  const MIGRATIONS = {};

  function coerce(spec, value) {
    if (value === undefined || value === null) return undefined;
    switch (spec.type) {
      case 'int': {
        const n = typeof value === 'number' ? value : Number.parseInt(String(value), 10);
        if (!Number.isInteger(n)) return undefined;
        if (spec.min !== undefined && n < spec.min) return undefined;
        if (spec.max !== undefined && n > spec.max) return undefined;
        return n;
      }
      case 'enum': {
        const v = typeof spec.values[0] === 'number' ? Number(value) : String(value);
        return spec.values.includes(v) ? v : undefined;
      }
      case 'bool': {
        if (typeof value === 'boolean') return value;
        if (value === '1' || value === 'true') return true;
        if (value === '0' || value === 'false') return false;
        return undefined;
      }
      case 'string':
        return String(value);
      case 'object':
        return typeof value === 'object' ? value : undefined;
      default:
        return undefined;
    }
  }

  function resolveSettings(schema, stored, query) {
    const out = {};
    for (const [key, spec] of Object.entries(schema)) {
      let v = coerce(spec, stored && stored[key]);
      if (spec.type !== 'object' && query && query[key] !== undefined) {
        const q = coerce(spec, query[key]);
        if (q !== undefined) v = q;

      out[key] = v === undefined ? spec.default : v;

    let settings = raw.settings;
    for (let v = raw.version; v < version; v++) {

      settings = m(settings);

  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1); }

  }

  // API 呼び出しはすべてこの fetchJson を使う(タイムアウトと失敗理由の整形を共通化)。
  const FETCH_TIMEOUT_MS = 20000;
  async function fetchJson(url) {
    try {
      const r = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(FETCH_TIMEOUT_MS) });
      if (!r.ok) return { ok: false, error: `HTTP ${r.status}` };
      return { ok: true, data: await r.json() };
    } catch (e) {
      const reason = e && (e.name === 'TimeoutError' || e.name === 'AbortError') ? 'timeout' : (e.message || 'network');
      return { ok: false, error: reason };
    }
  }

  function currentRange() { return Logic.rangeForView(settings.view, anchor, settings.weekStart); }
  function enabledIds() { return settings.calendars.filter((c) => c.enabled).map((c) => c.id); }
  function okText() {
    return lastOkAt ? Logic.t(settings.lang, 'updated_at', { time: formatTime(lastOkAt) }) : Logic.t(settings.lang, 'never_updated');
  }
  function reasonText(code, detail) {
    if (code === 'internal' && detail) return `${code}: ${detail}`;
    if (code === 'unauthorized') return Logic.t(settings.lang, 'err_unauthorized');
    // Chrome "Unexpected token '<'…", Firefox "JSON.parse: …", Safari "The string did not match the expected pattern", 旧 WebKit "JSON Parse error"
    if (code === 'invalid_response' || /JSON|Unexpected token|Unexpected end|did not match the expected pattern/i.test(code)) return Logic.t(settings.lang, 'invalid_response');
    return code;
  }

  async function refresh() {
    const connected = !!settings.gasUrl;
    $('#no-connection').hidden = connected;
    $('#cal-wrap').hidden = !connected;
    $('#range-title').hidden = !connected;
    setToolbarAttention(!connected);
    if (!connected) { setStatus('error', () => Logic.t(settings.lang, 'set_connection_hint')); return; }
    await fetchWindow(currentRange());
  }

  // 表示範囲の前後 31 日を一括取得してキャッシュする。失敗時は前回のキャッシュを残す。
  async function fetchWindow(range) {
    const seq = ++refreshSeq;
    const win = Logic.windowFor(range);
    if (settings.calendars.length > 0 && enabledIds().length === 0) {
      lastOkAt = new Date();
      cache = { from: win.from, to: win.to, events: [], calendars: settings.calendars.map((c) => ({ id: c.id, name: c.name, color: c.color })), errors: [], fetchedAt: lastOkAt };
      render();
      setStatus('ok', okText);
      return;
    }
    const url = Logic.gasRequestUrl(settings.gasUrl, { from: Logic.ymd(win.from), to: Logic.ymd(win.to), cal: enabledIds().join(','), token: settings.token });
    if (!url) return;
    setStatus('busy', () => Logic.t(settings.lang, 'updating'));
    const res = await fetchJson(url);
    if (seq !== refreshSeq) return;
    const norm = res.ok ? Logic.normalizeResponse(res.data) : { ok: false, error: res.error };
    if (!norm.ok) {
      setStatus('error', () => `${okText()} / ${Logic.t(settings.lang, 'error_fetch', { reason: reasonText(norm.error, norm.detail) })}`);
      render();
      // 失敗時は 1 分後に再試行。定期更新の予約は上書きされる
      scheduleRefresh(60000);
      return;
    }
    lastOkAt = new Date();
    cache = { from: win.from, to: win.to, events: norm.events, calendars: norm.calendars, errors: norm.errors, fetchedAt: lastOkAt };
    render();
    if (!Logic.coversRange(cache, currentRange())) { fetchWindow(currentRange()); return; }
    if (norm.errors.length) setStatus('warn', () => `${okText()} / ${Logic.t(settings.lang, 'partial_errors', { n: norm.errors.length })}`);
    else setStatus('ok', okText);
  }

  // 手動確認用: GAS なしで応答 JSON を流し込む(現在の表示範囲の窓として保存)
  function injectResponse(json) {
    const norm = Logic.normalizeResponse(json);
    if (!norm.ok) return norm;
    const win = Logic.windowFor(currentRange());
    lastOkAt = new Date();
    cache = { from: win.from, to: win.to, events: norm.events, calendars: norm.calendars, errors: norm.errors, fetchedAt: lastOkAt };
    render();
    setStatus('ok', okText);
    return norm;
  }

  const ALLDAY_ROWS = 3;

  function showRange() {
    const range = currentRange();
    $('#range-title').textContent = Logic.formatRangeTitle(settings.view, anchor, range, settings.lang);
    for (const b of $$('.view-btn')) b.setAttribute('aria-pressed', String(b.dataset.view === settings.view));
    scheduleReturnToToday();
    if (cache && !Logic.coversRange(cache, range)) { render(); fetchWindow(range); } else render();
  }

  // 3 枚のうち現在の枚を描く。隣の 2 枚はフリック / 前翌ボタンの直前に描く(renderNeighbors)。
  const panes = () => $$('#cal .pane');
  const currentPane = () => $('#cal .pane.current');
  let neighborsReady = false;
  function render() {
    renderPane(currentPane(), anchor);
    neighborsReady = false;
  }
  function renderNeighbors() {
    if (neighborsReady) return;
    const [prev, , next] = panes();
    renderPane(prev, Logic.shiftAnchor(settings.view, anchor, -1));
    renderPane(next, Logic.shiftAnchor(settings.view, anchor, 1));
    neighborsReady = true;
  }
  function renderPane(pane, at) {
    const month = settings.view === 'month';
    pane.querySelector('.timegrid').hidden = month;
    pane.querySelector('.month').hidden = !month;
    if (month) renderMonth(pane, Logic.monthGridDays(at, settings.weekStart));
    else renderTimeGrid(pane, Logic.daysInRange(Logic.rangeForView(settings.view, at, settings.weekStart)));
  }

  function calendarsFromGas() { return cache ? cache.calendars : []; }

  function eventEl(ev, cls, solid = true) {
    const e = el('div', cls);
    const color = Logic.eventColor(ev, settings.calendars, calendarsFromGas()) || accentColor();
    if (solid) { e.style.background = color; e.style.color = Logic.textColorFor(color); }
    else e.style.setProperty('--dot', color);
    e.addEventListener('click', (evt) => {
      evt.stopPropagation();
      if (typeof showPopover === 'function') showPopover(ev, e);
    });
    return e;
  }

  function barEl(b) {
    const e = eventEl(b.event, 'bar');
    e.style.gridRow = String(b.row + 1);
    e.style.gridColumn = `${b.startCol + 2} / span ${b.span}`;
    if (b.continuesLeft) e.classList.add('cont-left');
    if (b.continuesRight) e.classList.add('cont-right');
    e.textContent = (b.continuesLeft ? '‹ ' : '') + (b.event.title || Logic.t(settings.lang, 'untitled')) + (b.continuesRight ? ' ›' : '');
    return e;
  }

  function renderTimeGrid(pane, days) {
    const n = days.length;
    const now = new Date();
    const tg = pane.querySelector('.timegrid');
    tg.style.setProperty('--cols', String(n));
    tg.style.setProperty('--hours', String(settings.dayEnd - settings.dayStart));
    const events = cache ? cache.events : [];

    // 列見出し
    const hdr = pane.querySelector('.day-headers');
    hdr.replaceChildren(el('div', 'corner'));
    const wd = new Intl.DateTimeFormat(locale(), { weekday: 'short' });
    for (const d of days) {
      const h = el('div', 'day-head' + (Logic.isToday(d, now) ? ' today' : ''));
      h.appendChild(el('span', 'dnum', String(d.getDate())));
      h.appendChild(el('span', 'wd', wd.format(d)));
      hdr.appendChild(h);
    }

    // 終日帯(最大 ALLDAY_ROWS 行。超過は列ごとに +N)
    const bars = Logic.allDayBars(events, days);
    const ad = pane.querySelector('.allday');
    ad.replaceChildren(el('div', 'corner', Logic.t(settings.lang, 'all_day')));
    const overflow = bars.some((b) => b.row >= ALLDAY_ROWS);
    const extra = new Map(); // col -> count
    for (const b of bars) {
      if (!overflow || b.row < ALLDAY_ROWS - 1) { ad.appendChild(barEl(b)); continue; }
      for (let c = b.startCol; c < b.startCol + b.span; c++) extra.set(c, (extra.get(c) || 0) + 1);
    }
    for (const [c, k] of extra) {
      const m = el('div', 'bar more', Logic.t(settings.lang, 'more', { n: k }));
      m.style.gridRow = String(ALLDAY_ROWS);
      m.style.gridColumn = `${c + 2} / span 1`;
      ad.appendChild(m);
    }

    // 時刻グリッド
    const grid = pane.querySelector('.grid');
    grid.replaceChildren();
    const hours = el('div', 'hours');
    const span = settings.dayEnd - settings.dayStart;
    for (let h = settings.dayStart; h <= settings.dayEnd; h++) {
      const lab = el('div', 'hour-label', `${String(h).padStart(2, '0')}:00`);
      lab.style.top = `${((h - settings.dayStart) / span) * 100}%`;
      hours.appendChild(lab);
    }
    grid.appendChild(hours);
    const tf = timeFmt();
    for (const d of Logic.segmentsByDay(events, days)) {
      const today = Logic.isToday(d.date, now);
      const col = el('div', 'day-col' + (today ? ' today' : ''));
      for (const { seg, col: c, cols } of Logic.layoutColumns(d.timed)) {
        const clip = Logic.clipToHours(seg, settings.dayStart, settings.dayEnd);
        if (!clip) continue;
        const b = eventEl(seg.event, 'ev');
        b.style.top = `${clip.topPct}%`;
        b.style.height = `${clip.heightPct}%`;
        b.style.left = `calc(${(c / cols) * 100}% + 1px)`;
        b.style.width = `calc(${100 / cols}% - 2px)`;
        if (clip.clippedTop) b.classList.add('clip-top');
        if (clip.clippedBottom) b.classList.add('clip-bottom');
        b.appendChild(el('span', 'ev-time', tf.format(seg.event.start)));
        b.appendChild(el('span', 'ev-title', seg.event.title || Logic.t(settings.lang, 'untitled')));
        col.appendChild(b);
      }
      if (today) col.appendChild(el('div', 'now-line'));
      grid.appendChild(col);
    }
    updateNowLine();
  }

  function updateNowLine() {
    const pct = Logic.nowLinePct(new Date(), settings.dayStart, settings.dayEnd);
    for (const line of $$('.now-line')) {
      line.hidden = pct === null;
      if (pct !== null) line.style.top = `${pct}%`;
    }
  }

  function renderMonth(pane, days) {
    const month = pane.querySelector('.month');
    month.replaceChildren();
    const wd = new Intl.DateTimeFormat(locale(), { weekday: 'short' });
    for (let i = 0; i < 7; i++) month.appendChild(el('div', 'mhead', wd.format(days[i].date)));
    const now = new Date();
    const cells = days.map((d) => {
      const c = el('div', 'cell' + (d.inMonth ? '' : ' out') + (Logic.isToday(d.date, now) ? ' today' : ''));
      c.appendChild(el('div', 'dnum', String(d.date.getDate())));
      month.appendChild(c);
      return c;
    });
    // 1 セルに入る行数は実測で決める(高さと文字サイズに追従)
    const probe = cells[0];
    const lineH = parseFloat(getComputedStyle(probe).fontSize) * 1.35;
    const max = Math.max(1, Math.floor((probe.clientHeight - probe.firstElementChild.offsetHeight - 4) / lineH));
    const events = cache ? cache.events : [];
    const tf = timeFmt();
    Logic.monthCells(events, days, max).forEach((cell, i) => {
      for (const it of cell.items) {
        const e = eventEl(it.event, 'mitem' + (it.allDay ? ' allday' : ''), it.allDay);
        e.textContent = (it.allDay ? '' : `${tf.format(it.event.start)} `) + (it.event.title || Logic.t(settings.lang, 'untitled'));
        cells[i].appendChild(e);
      }
      if (cell.more) cells[i].appendChild(el('div', 'mitem more', Logic.t(settings.lang, 'more', { n: cell.more })));
    });
  }

  let returnTimer = null;

  // カルーセルの位置。offset は現在の枚からのずれ(px、右が正)。
  const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const paneWidth = () => $('#cal-wrap').clientWidth;
  function setTrackOffset(offset) { $('#cal').style.transform = `translateX(calc(-100% / 3 + ${offset}px))`; }
  function resetTrack() { $('#cal').style.transform = ''; }

  // 枚の役割を回す: dir > 0 なら 前 の枚を末尾へ(翌 が現在になる)、dir < 0 なら 翌 の枚を先頭へ
  function rotatePanes(dir) {
    const track = $('#cal');
    const [prev, cur, next] = panes();
    cur.classList.remove('current');
    if (dir > 0) { track.appendChild(prev); next.classList.add('current'); }
    else { track.insertBefore(next, prev); prev.classList.add('current'); }
  }

  let navigating = false;
  // 前 / 翌 / フリックの移動。隣の枚へトラックを流し、着いたら役割を回して現在を描き直す。
  function navigate(dir, fromOffset = 0) {
    if (navigating) return;
    hidePopover();
    clearSwipeHints();
    const finish = () => {
      rotatePanes(dir);
      const track = $('#cal');
      track.classList.remove('animate');
      resetTrack();
      anchor = Logic.shiftAnchor(settings.view, anchor, dir);
      navigating = false;
      showRange();
    };
    if (reducedMotion()) { finish(); return; }
    renderNeighbors();
    navigating = true;
    const track = $('#cal');
    const target = -dir * paneWidth();
    if (fromOffset === 0) { setTrackOffset(0); void track.offsetWidth; }
    track.classList.add('animate');
    let done = false;
    const onEnd = (e) => { if (e && e.target !== track) return; if (done) return; done = true; track.removeEventListener('transitionend', onEnd); finish(); };
    track.addEventListener('transitionend', onEnd);
    setTimeout(onEnd, 400);   // transitionend が来ない場合の保険
    setTrackOffset(target);
  }
  function settleTrack() {
    const track = $('#cal');
    track.classList.add('animate');
    setTrackOffset(0);
    let done = false;
    const onEnd = (e) => { if (e && e.target !== track) return; if (done) return; done = true; track.removeEventListener('transitionend', onEnd); track.classList.remove('animate'); resetTrack(); };
    track.addEventListener('transitionend', onEnd);
    setTimeout(onEnd, 400);   // transition が無効(reduced motion)でも後始末する
  }
  function showSwipeHint(dx, armed) {
    const prev = $('#swipe-prev'), next = $('#swipe-next');
    const hint = dx > 0 ? prev : next, other = dx > 0 ? next : prev;
    other.classList.remove('show', 'armed');
    if (dx === 0) { hint.classList.remove('show', 'armed'); return; }
    hint.classList.add('show');
    hint.classList.toggle('armed', armed);
  }
  function clearSwipeHints() { for (const h of $$('.swipe-hint')) h.classList.remove('show', 'armed'); }
  function goToday() {
    anchor = Logic.startOfDay(new Date());
    hidePopover();
    showRange();
  }
  // 今日以外を見ているときだけ、無操作 returnToTodayMinutes 分で今日へ戻す
  function rangeContainsNow() { const now = new Date(); const r = currentRange(); return r.from <= now && now < r.to; }
  function scheduleReturnToToday() {
    clearTimeout(returnTimer);
    const mins = settings.returnToTodayMinutes;
    if (mins > 0 && !rangeContainsNow()) returnTimer = setTimeout(goToday, mins * 60000);
  }

  function bindNav() {
    $('#btn-prev').addEventListener('click', () => navigate(-1));
    $('#btn-next').addEventListener('click', () => navigate(1));
    $('#btn-today').addEventListener('click', goToday);
    for (const b of $$('.view-btn')) b.addEventListener('click', () => updateSettings({ view: b.dataset.view }));
    const cal = $('#cal');
    let down = null;
    let offset = 0;
    // 指がカレンダーの外で離れても拾えるよう、押下中は window で move / up / cancel を受ける
    const onMove = (e) => {
      if (!down || down.id !== e.pointerId) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      const f = Logic.swipeOffset(dx, dy, paneWidth());
      if (!f.active) { offset = 0; setTrackOffset(0); clearSwipeHints(); return; }
      showSwipeHint(dx, f.armed);
      if (reducedMotion()) return;
      offset = f.offset;
      setTrackOffset(offset);
    };
    const detach = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
    };
    const onUp = (e) => {
      if (!down || down.id !== e.pointerId) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      down = null;
      detach();
      clearSwipeHints();
      if (Logic.isSwipe(dx, dy)) navigate(dx < 0 ? 1 : -1, offset);
      else settleTrack();
      offset = 0;
    };
    const onCancel = (e) => {
      if (!down || down.id !== e.pointerId) return;
      down = null;
      detach();
      clearSwipeHints();
      settleTrack();
      offset = 0;
    };
    cal.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || down || navigating) return;
      down = { x: e.clientX, y: e.clientY, id: e.pointerId };
      offset = 0;
      renderNeighbors();
      cal.classList.remove('animate');
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onCancel);
    });
    let lastActivity = 0;
    const onActivity = () => { const now = Date.now(); if (now - lastActivity < 500) return; lastActivity = now; scheduleReturnToToday(); };
    for (const ev of ['pointermove', 'pointerdown', 'touchstart', 'keydown']) document.addEventListener(ev, onActivity, { passive: true });
    document.addEventListener('pointerdown', (e) => {
      const pop = $('#popover');
      if (!pop.hidden && !pop.contains(e.target)) hidePopover();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hidePopover(); });
  }

  function formatEventWhen(ev) {
    const dFmt = new Intl.DateTimeFormat(locale(), { month: 'numeric', day: 'numeric', weekday: 'short' });
    if (ev.allDay) {
      const last = Logic.addDays(ev.end, -1);
      return last > ev.start ? `${dFmt.format(ev.start)} – ${dFmt.format(last)}` : dFmt.format(ev.start);
    }
    const tf = timeFmt();
    const sameDay = Logic.startOfDay(ev.start).getTime() === Logic.startOfDay(new Date(ev.end.getTime() - 1)).getTime();
    return sameDay
      ? `${dFmt.format(ev.start)} ${tf.format(ev.start)} – ${tf.format(ev.end)}`
      : `${dFmt.format(ev.start)} ${tf.format(ev.start)} – ${dFmt.format(ev.end)} ${tf.format(ev.end)}`;
  }

  function showPopover(ev, anchorEl) {
    const pop = $('#popover');
    pop.replaceChildren();
    pop.appendChild(el('div', 'pop-title', ev.title || Logic.t(settings.lang, 'untitled')));
    pop.appendChild(el('div', 'pop-line', formatEventWhen(ev)));
    const cal = settings.calendars.find((c) => c.id === ev.calendarId) || calendarsFromGas().find((c) => c.id === ev.calendarId);
    if (cal) pop.appendChild(el('div', 'pop-line muted', `${Logic.t(settings.lang, 'calendar_label')}: ${cal.name}`));
    if (ev.location) pop.appendChild(el('div', 'pop-line', `${Logic.t(settings.lang, 'location_label')}: ${ev.location}`));
    if (ev.description) pop.appendChild(el('div', 'pop-desc', ev.description));
    pop.hidden = false;
    pop.style.left = '0px'; pop.style.top = '0px';
    const r = anchorEl.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 6;
    const left = Math.min(Math.max(gap, r.left), window.innerWidth - pw - gap);
    let top = r.bottom + gap;
    if (top + ph > window.innerHeight - gap) top = Math.max(gap, r.top - ph - gap);
    pop.style.left = `${left}px`;
    pop.style.top = `${top}px`;
  }
  function hidePopover() { $('#popover').hidden = true; }

  // ページ固有: 設定タブに項目を追加する。
  function setConnMessage(state, text) {
    const m = $('#conn-message');
    m.dataset.state = state;
    m.textContent = text;
  }

  function renderConnectionTab() {
    const typed = rawUrl.trim();
    if (typed && !Logic.validGasUrl(typed)) { setConnMessage('error', Logic.t(settings.lang, 'invalid_url')); urlErrorShown = true; }
    else if (urlErrorShown) { setConnMessage('none', ''); urlErrorShown = false; }
    const list = $('#cal-list');
    list.replaceChildren();
    if (settings.calendars.length === 0) { list.appendChild(el('p', 'hint', Logic.t(settings.lang, 'no_calendars'))); return; }
    for (const c of settings.calendars) {
      const label = el('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = c.enabled; cb.dataset.id = c.id; cb.dataset.field = 'enabled';
      const color = document.createElement('input');
      color.type = 'color'; color.value = c.color || accentColor(); color.dataset.id = c.id; color.dataset.field = 'color';
      label.append(cb, color, el('span', null, c.name));
      list.appendChild(label);
    }
  }

  function bindConnectionTab() {
    $('#btn-copy-code').addEventListener('click', async () => {
      const ta = $('#gas-code');
      let ok = false;
      try { await navigator.clipboard.writeText(ta.value); ok = true; } catch { /* クリップボード API 不可 → 選択してフォールバック */ }
      if (!ok) { ta.focus(); ta.select(); try { ok = document.execCommand('copy'); } catch { ok = false; } }
      $('#copy-message').textContent = Logic.t(settings.lang, ok ? 'copied' : 'copy_failed');
      setTimeout(() => { $('#copy-message').textContent = ''; }, 3000);
    });
    $('#set-gas-url').addEventListener('input', (e) => { rawUrl = e.target.value; });
    $('#btn-conn-list').addEventListener('click', async () => {
      const url = Logic.gasRequestUrl(settings.gasUrl, { action: 'list', token: settings.token });
      if (!url) { setConnMessage('error', Logic.t(settings.lang, 'invalid_url')); return; }
      const key = settings.gasUrl + '\n' + settings.token;
      const btn = $('#btn-conn-list');
      btn.disabled = true;
      let res;
      try {
        setConnMessage('none', Logic.t(settings.lang, 'updating'));
        res = await fetchJson(url);
      } finally { btn.disabled = false; }
      if (key !== settings.gasUrl + '\n' + settings.token) return;
      const norm = res.ok ? Logic.normalizeResponse(res.data) : { ok: false, error: res.error };
      if (!norm.ok) { setConnMessage('error', Logic.t(settings.lang, 'conn_failed', { reason: reasonText(norm.error, norm.detail) })); return; }
      rawUrl = '';
      updateSettings({ calendars: Logic.mergeCalendarList(settings.calendars, norm.calendars) });
      setConnMessage('ok', Logic.t(settings.lang, 'conn_ok', { n: norm.calendars.length }));
    });
    $('#cal-list').addEventListener('change', (e) => {
      const t = e.target;
      if (!t.dataset || !t.dataset.id) return;
      const calendars = settings.calendars.map((c) => {
        if (c.id !== t.dataset.id) return c;
        return t.dataset.field === 'enabled' ? { ...c, enabled: t.checked } : { ...c, color: Logic.normalizeHex(t.value) };
      });
      updateSettings({ calendars });
    });
  }

  function renderSettingsExtra(_settings) { renderConnectionTab(); }

  function scheduleRefresh(delayMs) {
    clearTimeout(refreshTimer);
    const delay = delayMs ?? settings.refreshMinutes * 60000;
    nextRefreshAt = Date.now() + delay;
    // 古い更新の finally が新しい予約を消さないように、自分のタイマーが現役のときだけ再予約する
    const mine = setTimeout(async () => {
      try { await refresh(); } finally { if (refreshTimer === mine) scheduleRefresh(); }
    }, delay);
    refreshTimer = mine;
  }

  function onVisibility() {
    if (document.visibilityState === 'visible' && Date.now() >= nextRefreshAt) scheduleRefresh(0);
  }

  function resetIdle() {
    $('#toolbar').classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (!toolbarAttention) $('#toolbar').classList.add('idle'); }, IDLE_MS);
  }

  function showTab(name) {
    for (const t2 of $$('[role="tab"]')) t2.setAttribute('aria-selected', String(t2.dataset.tab === name));
    for (const p of $$('.tab-panel')) p.classList.toggle('active', p.dataset.panel === name);
    if (name === 'data') refreshDataText();
  }

  function refreshDataText() {
    $('#data-text').value = JSON.stringify({ version: Logic.VERSION, settings }, null, 2);
    setDataMessage('none', '');
  }

  function setDataMessage(state, text) {
    const el = $('#data-message');
    el.dataset.state = state;
    el.textContent = text;
  }

  function importText(text) {
    const result = Logic.parseImport(text, Logic.VERSION);
    if (!result.ok) {
      setDataMessage('error', Logic.t(settings.lang, result.reason === 'invalid_json' ? 'import_failed_json' : 'import_failed_format'));
      return;
    }
    updateSettings(result.settings);
    refreshDataText();
    setDataMessage('ok', Logic.t(settings.lang, 'import_ok'));
  }

  function renderAbout() {
    $('#about-page').href = `${REPO_URL}/tree/main/${ABOUT.page}`;
    const list = $('#about-credits');
    const icons = list.firstElementChild; // credit_icons の li は残す
    list.replaceChildren(...(icons ? [icons] : []));
    for (const c of ABOUT.credits) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = c.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = c.name;
      li.appendChild(a);
      if (c.note) li.appendChild(document.createTextNode(` — ${c.note}`));
      list.appendChild(li);
    }
  }

  function bindSettingsDialog() {
    const dlg = $('#settings');
    $('#settings-close').addEventListener('click', () => dlg.close());
    // 背景クリックで閉じる。テキスト選択などで内側から押して背景で離した場合は閉じない。
    let downOnBackdrop = false;
    dlg.addEventListener('pointerdown', (ev) => { downOnBackdrop = ev.target === dlg; });
    dlg.addEventListener('click', (ev) => {
      if (downOnBackdrop && ev.target === dlg) dlg.close();
      downOnBackdrop = false;
    });
    for (const tab of $$('[role="tab"]')) tab.addEventListener('click', () => showTab(tab.dataset.tab));
    for (const el of $$('[data-setting]')) {
      el.addEventListener('change', () => updateSettings({ [el.dataset.setting]: el.value }));
    }
    $('#btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ version: Logic.VERSION, settings }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const d = new Date();
      const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      a.download = `simplePages-${PAGE}-${ymd}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    $('#btn-import').addEventListener('click', () => $('#import-file').click());
    $('#import-file').addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      if (file) importText(await file.text());
      ev.target.value = '';
    });
    $('#btn-import-text').addEventListener('click', () => importText($('#data-text').value));
    $('#btn-clear').addEventListener('click', () => {
      if (!confirm(Logic.t(settings.lang, 'confirm_clear'))) return;
      storage.clear();
      location.href = location.pathname;
    });
    renderAbout();
  }

  function init() {
    loadSettings();
    const startDate = Logic.parseYmd(new URLSearchParams(location.search).get('date'));
    if (startDate) anchor = startDate;
    bindSettingsDialog();
    bindToolbar();
    bindConnectionTab();
    bindNav();
    applySettings();
    scheduleRefresh(0);
    tickClock();
    setInterval(tickClock, 1000);
    document.addEventListener('visibilitychange', onVisibility);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    for (const ev of ['pointermove', 'pointerdown', 'touchstart', 'keydown']) document.addEventListener(ev, resetIdle, { passive: true });
    setInterval(updateNowLine, 60000);
    // 日付が変わったら今日の列と月グリッドを更新する
    let dayKey = Logic.ymd(new Date());
    setInterval(() => { const k = Logic.ymd(new Date()); if (k !== dayKey) { if (Logic.ymd(anchor) === dayKey) anchor = Logic.startOfDay(new Date()); dayKey = k; showRange(); } }, 30000);
    let resizeTimer = null;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 300); });
    resetIdle();
  }

  document.addEventListener('DOMContentLoaded', init);

  return { getSettings, updateSettings, setStatus, scheduleRefresh, refresh, fetchJson, applyZoom, setToolbarAttention, getCache: () => cache, injectResponse, navigate, goToday };
})();
</script>
</body>
</html>
